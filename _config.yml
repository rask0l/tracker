# Personal tracker — gym + CWES study. Private-ish: noindex, not linked from the writeup site.
title: tracker
tagline: gym + study progress
description: Personal gym and CWES study tracker.
lang: en
timezone: Asia/Phnom_Penh

# Deployed as a GitHub Pages project site at rask0l.github.io/tracker
url: "https://rask0l.github.io"
baseurl: "/tracker"

# Keep the whole site out of search engines.
defaults:
  - scope:
      path: ""
    values:
      noindex: true
      sitemap: false

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

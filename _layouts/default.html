<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
</head>
<body class="layout-{{ page.layout | default: 'default' }}">
  <div class="wrap">
    <header class="site-head">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}">home</a> //
        <a href="{{ '/loop/' | relative_url }}">loop</a> //
        <a href="{{ '/sched/' | relative_url }}">sched</a> //
        <a href="{{ '/notes/' | relative_url }}">notes</a> //
        <a href="{{ '/gym/' | relative_url }}">gym</a> //
        <a href="{{ '/neuroplasticity/' | relative_url }}">blog</a>
      </nav>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-foot">
      <span>{{ site.title }} · private</span>
    </footer>
  </div>
</body>
</html>

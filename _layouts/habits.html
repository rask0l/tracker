---
layout: default
---

<article class="tracker habits">
  <h1>{{ site.data.habits.title | default: "Habits" }}</h1>
  <div id="habits"></div>
</article>

<script>
(function () {
  var KEY = 'habit-tracker-v1';
  var SEED = {{ site.data.habits | jsonify }};
  var SCOPES = ['daily', 'weekly', 'monthly'];
  var KINDS = ['normal', 'must', 'reward'];
  var TITLES = { daily: 'Daily Non-Negotiables', weekly: 'Weekly Achievement', monthly: 'Monthly Achievement' };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function ym() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function yw() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));       // nearest Thursday
    var week1 = new Date(d.getFullYear(), 0, 4);
    var wk = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    return d.getFullYear() + '-W' + pad(wk);
  }
  function periodOf(sc) { return sc === 'daily' ? today() : sc === 'weekly' ? yw() : ym(); }

  function uid() { return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function nextKind(k) { var i = KINDS.indexOf(k); return KINDS[(i + 1) % KINDS.length]; }

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function seed() {
    var s = { version: 1, period: {}, sections: {} };
    SCOPES.forEach(function (sc) {
      s.period[sc] = periodOf(sc);
      s.sections[sc] = (SEED[sc] || []).map(function (it) {
        return { id: uid(), text: it.text, kind: it.kind || 'normal', done: false };
      });
    });
    return s;
  }

  var state = load();
  if (!state || !state.sections) { state = seed(); save(); }
  state.period = state.period || {};
  state.sections = state.sections || {};
  SCOPES.forEach(function (sc) { if (!state.sections[sc]) state.sections[sc] = []; });

  // period reset: clear checks when the day / week / month rolls over
  var changed = false;
  SCOPES.forEach(function (sc) {
    var p = periodOf(sc);
    if (state.period[sc] !== p) {
      state.sections[sc].forEach(function (it) { it.done = false; });
      state.period[sc] = p;
      changed = true;
    }
  });
  if (changed) save();

  var root = document.getElementById('habits');
  function findItem(sc, id) {
    var a = state.sections[sc];
    for (var i = 0; i < a.length; i++) { if (a[i].id === id) return a[i]; }
    return null;
  }

  // Update just one section's count + progress bar (no full re-render).
  function refreshHead(sc) {
    var sec = root.querySelector('.habit-group[data-scope="' + sc + '"]');
    if (!sec) return;
    var items = state.sections[sc];
    var done = 0;
    items.forEach(function (x) { if (x.done) done++; });
    var pct = items.length ? Math.round(done / items.length * 100) : 0;
    sec.querySelector('.habit-meta').textContent = done + ' / ' + items.length;
    sec.querySelector('.habit-bar span').style.width = pct + '%';
  }

  function makeLi(it) {
    var li = document.createElement('li');
    li.className = 'habit ' + it.kind + (it.done ? ' done' : '');
    li.dataset.id = it.id;
    li.innerHTML =
      '<input type="checkbox" class="hcheck"' + (it.done ? ' checked' : '') + '>' +
      '<input type="text" class="htext" spellcheck="false" value="' + esc(it.text) + '" placeholder="new habit…">' +
      '<button class="kind-dot" type="button" title="tap to change type: normal / must / reward" aria-label="change type"></button>' +
      '<button class="hdel" type="button" title="remove">✕</button>';
    return li;
  }

  // Wire a single row. Every interaction touches only that row (+ its header),
  // so checking a box never tears down and re-attaches the other rows.
  function wireLi(li, sc) {
    var id = li.dataset.id;
    li.querySelector('.hcheck').addEventListener('change', function (e) {
      var it = findItem(sc, id); if (!it) return;
      it.done = e.target.checked;
      li.classList.toggle('done', it.done);
      save(); refreshHead(sc);
    });
    li.querySelector('.htext').addEventListener('change', function (e) {
      var it = findItem(sc, id); if (!it) return;
      it.text = e.target.value; save();
    });
    li.querySelector('.kind-dot').addEventListener('click', function () {
      var it = findItem(sc, id); if (!it) return;
      it.kind = nextKind(it.kind);
      li.className = 'habit ' + it.kind + (it.done ? ' done' : '');
      save();
    });
    li.querySelector('.hdel').addEventListener('click', function () {
      var it = findItem(sc, id); if (!it) return;
      if (!confirm('Remove "' + (it.text || 'this item') + '"?')) return;
      state.sections[sc] = state.sections[sc].filter(function (x) { return x.id !== id; });
      li.parentNode.removeChild(li);
      save(); refreshHead(sc);
    });
  }

  function render() {
    root.innerHTML = '';
    SCOPES.forEach(function (sc) {
      var sec = document.createElement('section');
      sec.className = 'habit-group';
      sec.dataset.scope = sc;
      sec.innerHTML =
        '<div class="habit-head"><h2>' + TITLES[sc] + '</h2><span class="habit-meta"></span></div>' +
        '<div class="habit-bar"><span></span></div>' +
        '<ul class="habit-list"></ul>' +
        '<button class="habit-add" type="button">+ add</button>';
      var ul = sec.querySelector('.habit-list');
      state.sections[sc].forEach(function (it) {
        var li = makeLi(it);
        ul.appendChild(li);
        wireLi(li, sc);
      });
      sec.querySelector('.habit-add').addEventListener('click', function () {
        var it = { id: uid(), text: '', kind: 'normal', done: false };
        state.sections[sc].push(it);
        var li = makeLi(it);
        ul.appendChild(li);
        wireLi(li, sc);
        save(); refreshHead(sc);
        li.querySelector('.htext').focus();
      });
      root.appendChild(sec);
      refreshHead(sc);
    });
  }

  render();
})();
</script>

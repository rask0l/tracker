---
layout: default
---

<style>
  /* ============================================================
     ARTICLE — shared shell for the blog pieces at /blog/.
     Brutalist mono, matching /loop/. Each article supplies its
     title, meta, dek and foot via front matter; the body holds
     the sections. Add a new piece by dropping in a page with
     `layout: article` and it self-lists on the index.
     ============================================================ */
  .layout-article .wrap { max-width: 880px; }

  .article {
    --acc: #d92b1f;
    --line: var(--fg);
    font-family: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color: var(--fg);
    line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) { .article { --acc: #ff4a3d; } }

  .article b { font-weight: 700; }
  .article i { font-style: normal; text-decoration: underline; text-underline-offset: 2px; }

  .article .back {
    display: inline-block; margin: 0 0 1.4rem; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--acc); text-decoration: none; border: 0;
  }
  .article .back:hover { text-decoration: underline; }

  .article h1 {
    font-family: inherit;
    font-style: normal;
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 4.4rem);
    line-height: 0.92;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin: 0;
    border: 0;
  }

  .article .meta {
    margin: 1rem 0 0;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: var(--muted);
  }

  .article .dek {
    font-size: 1.02rem;
    max-width: 62ch;
    margin: 1.2rem 0 0;
  }

  .article .sect-h {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin: 2.6rem 0 0.9rem;
  }
  .article .sect-h .n { color: var(--acc); }

  .article p.body {
    max-width: 68ch;
    margin: 0 0 1rem;
    font-size: 0.95rem;
  }

  .article .callout {
    border-left: 4px solid var(--acc);
    padding: 0.9rem 1.1rem;
    margin: 1.4rem 0;
    max-width: 68ch;
    font-size: 0.93rem;
    background: var(--accent-bg);
  }
  .article .callout b { color: var(--acc); }

  .article .protocol { border: 2px solid var(--line); list-style: none; margin: 0; padding: 0; }
  .article .protocol li {
    display: grid;
    grid-template-columns: 3rem minmax(0, 1fr);
    gap: 0.8rem;
    padding: 0.85rem 1rem;
    font-size: 0.9rem;
    align-items: baseline;
  }
  .article .protocol li + li { border-top: 2px solid var(--line); }
  .article .protocol .rn { font-weight: 800; color: var(--acc); font-size: 1.05rem; }
  .article .protocol .note { color: var(--muted); }

  .article .sources { margin: 0; padding: 0; list-style: none; font-size: 0.78rem; }
  .article .sources li { margin: 0 0 0.5rem; }
  .article .sources a { color: var(--muted); }

  .article .art-foot {
    margin-top: 2.4rem;
    padding-top: 1rem;
    border-top: 3px solid var(--line);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
  }
</style>

<div class="article">
  <a class="back" href="{{ '/blog/' | relative_url }}">&larr; blog</a>

  <h1>{{ page.title }}</h1>
  {% if page.meta %}<p class="meta">{{ page.meta }}</p>{% endif %}
  {% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}

  {{ content }}

  {% if page.foot %}<p class="art-foot">{{ page.foot }}</p>{% endif %}
</div>

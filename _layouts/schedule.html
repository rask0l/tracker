---
layout: default
---

<style>
  /* ============================================================
     THE SCHEDULE — a real day/week/month planner. Brutalist mono.
     Saves to localStorage (key: sched-v1). The static roadmap +
     study plan + rules live at /loop/.
     ============================================================ */
  .layout-schedule .wrap { max-width: 880px; }

  .sched-app {
    --acc: #d92b1f;
    --line: var(--fg);
    font-family: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color: var(--fg);
    line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) { .sched-app { --acc: #ff4a3d; } }

  .sched-app [hidden] { display: none !important; }
  .sched-app b { font-weight: 700; }

  /* ---- header ---- */
  .sched-app h1 {
    font-family: inherit; font-style: normal; font-weight: 800;
    font-size: clamp(2.6rem, 10vw, 5rem); line-height: 0.9;
    letter-spacing: -0.03em; text-transform: uppercase; margin: 0; border: 0;
  }
  .sched-app .sub { font-size: 0.98rem; max-width: 54ch; margin: 1.1rem 0 0; }
  .sched-app .xlink {
    display: inline-block; margin-top: 0.9rem; font-size: 0.78rem;
    color: var(--acc); text-decoration: none; border: 0;
  }
  .sched-app .xlink:hover { text-decoration: underline; }

  /* ---- toolbar ---- */
  .sched-app .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem;
    margin-top: 1.8rem; padding-bottom: 1rem; border-bottom: 2px solid var(--line);
  }
  .sched-app .nav-grp { display: flex; align-items: center; gap: 0.5rem; }
  .sched-app button {
    font-family: inherit; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.4rem 0.65rem; cursor: pointer; background: transparent; color: var(--fg); border: 2px solid var(--line);
  }
  .sched-app button:hover { background: var(--fg); color: var(--bg); }
  .sched-app button.active { background: var(--acc); color: #fff; border-color: var(--acc); }
  .sched-app .nav-arrow { padding: 0.4rem 0.6rem; }
  .sched-app .label {
    min-width: 11rem; text-align: center; font-weight: 800; font-size: 1rem;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .sched-app .views { display: flex; gap: 0.4rem; margin-left: auto; }
  .sched-app .today-btn { color: var(--acc); border-color: var(--acc); }
  .sched-app .today-btn:hover { background: var(--acc); color: #fff; }

  /* ---- month grid ---- */
  .sched-app .month-head {
    display: grid; grid-template-columns: repeat(7, 1fr);
    border: 2px solid var(--line); border-bottom: 0;
  }
  .sched-app .month-head span {
    padding: 0.5rem 0; text-align: center; font-size: 0.66rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); border-right: 2px solid var(--line);
  }
  .sched-app .month-head span:last-child { border-right: 0; }
  .sched-app .grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 2px solid var(--line); }
  .sched-app .cell {
    position: relative; min-height: 4.2rem; padding: 0.4rem 0.5rem;
    border-right: 2px solid var(--line); border-top: 2px solid var(--line);
    cursor: pointer; font-size: 0.85rem;
  }
  .sched-app .cell:nth-child(7n) { border-right: 0; }
  .sched-app .cell:nth-child(-n+7) { border-top: 0; }
  .sched-app .cell:hover { background: var(--accent-bg); }
  .sched-app .cell.other { color: var(--muted); }
  .sched-app .cell.today .num { color: var(--acc); font-weight: 800; }
  .sched-app .cell .num { font-variant-numeric: tabular-nums; }
  .sched-app .cell .mark {
    position: absolute; top: 0.4rem; right: 0.5rem; font-size: 0.7rem; color: var(--acc); font-weight: 700;
  }
  .sched-app .cell .snip {
    margin-top: 0.3rem; font-size: 0.68rem; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---- week list ---- */
  .sched-app .week { border: 2px solid var(--line); }
  .sched-app .week > * + * { border-top: 2px solid var(--line); }
  .sched-app .wrow { display: grid; grid-template-columns: 8.5rem 1fr auto; align-items: center; }
  .sched-app .wrow.today { background: var(--accent-bg); }
  .sched-app .wday { padding: 0.9rem 1rem; cursor: pointer; }
  .sched-app .wday .dow { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; }
  .sched-app .wday .dnum { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; font-variant-numeric: tabular-nums; }
  .sched-app .wtext {
    font-family: inherit; font-size: 0.88rem; padding: 0.9rem 0.5rem; border: 0; background: transparent; color: var(--fg);
  }
  .sched-app .wtext:focus { outline: none; background: var(--accent-bg); }
  .sched-app .wdone { margin-right: 1rem; accent-color: var(--acc); width: 1.1rem; height: 1.1rem; cursor: pointer; }

  /* ---- day panel ---- */
  .sched-app .day { border: 2px solid var(--line); padding: 1.2rem 1.3rem; }
  .sched-app .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .sched-app .day-title { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; }
  .sched-app .day-chk { display: flex; align-items: center; gap: 0.5rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .sched-app .day-chk input { accent-color: var(--acc); width: 1.1rem; height: 1.1rem; cursor: pointer; }
  .sched-app .day textarea {
    display: block; width: 100%; min-height: 180px; margin-top: 1rem; resize: vertical;
    font-family: inherit; font-size: 0.9rem; line-height: 1.7; padding: 0.8rem;
    border: 2px solid var(--line); background: transparent; color: var(--fg);
  }
  .sched-app .day textarea:focus { outline: none; background: var(--accent-bg); }
  .sched-app .day-foot { margin-top: 0.8rem; display: flex; justify-content: flex-end; }
  .sched-app .day-clear { color: var(--acc); border-color: var(--acc); }
  .sched-app .day-clear:hover { background: var(--acc); color: #fff; }

  /* ---- day checklist ---- */
  .sched-app .day-tasks { margin-top: 1.4rem; }
  .sched-app .tasks-h { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 0.6rem; }
  .sched-app .task-add { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  .sched-app .task-add input {
    flex: 1; font-family: inherit; font-size: 0.85rem; padding: 0.5rem 0.6rem;
    border: 2px solid var(--line); background: transparent; color: var(--fg);
  }
  .sched-app .task-add input:focus { outline: none; background: var(--accent-bg); }
  .sched-app .task-list { list-style: none; margin: 0; padding: 0; border: 2px solid var(--line); }
  .sched-app .task-list:empty { display: none; }
  .sched-app .task-list li { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.7rem; }
  .sched-app .task-list li + li { border-top: 2px solid var(--line); }
  .sched-app .task-list input[type="checkbox"] { accent-color: var(--acc); width: 1.1rem; height: 1.1rem; cursor: pointer; flex: none; }
  .sched-app .task-list .tt { flex: 1; font-size: 0.88rem; cursor: pointer; }
  .sched-app .task-list li.done .tt { color: var(--muted); text-decoration: line-through; }
  .sched-app .task-list .tdel {
    flex: none; border: 0; background: transparent; color: var(--muted);
    font-size: 0.9rem; padding: 0.1rem 0.4rem; cursor: pointer;
  }
  .sched-app .task-list .tdel:hover { color: var(--acc); background: transparent; }

  /* ---- task-count badge (month cells + week rows) ---- */
  .sched-app .badge {
    font-size: 0.65rem; font-weight: 700; color: var(--acc); font-variant-numeric: tabular-nums;
  }

  @media (max-width: 620px) {
    .sched-app .cell { min-height: 3rem; font-size: 0.72rem; padding: 0.3rem; }
    .sched-app .cell .snip { display: none; }
    .sched-app .wrow { grid-template-columns: 1fr; }
    .sched-app .wdone { margin: 0 1rem 0.9rem; justify-self: start; }
  }
</style>

<div class="sched-app">
  <h1>The Schedule</h1>
  <p class="sub">A real day / week / month planner. Click a day, write what it's for.</p>
  <a class="xlink" href="{{ '/loop/' | relative_url }}">&rarr; the roadmap, the study plan, the rules</a>

  <div class="toolbar">
    <div class="nav-grp">
      <button type="button" class="nav-arrow" id="sc-prev">&lsaquo;</button>
      <span class="label" id="sc-label">—</span>
      <button type="button" class="nav-arrow" id="sc-next">&rsaquo;</button>
    </div>
    <button type="button" class="today-btn" id="sc-today">Today</button>
    <div class="views">
      <button type="button" data-view="day">Day</button>
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="month">Month</button>
    </div>
  </div>

  <div id="sc-month">
    <div class="month-head">
      <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
    </div>
    <div class="grid" id="sc-grid"></div>
  </div>

  <div id="sc-week" class="week" hidden></div>

  <div id="sc-day" class="day" hidden>
    <div class="day-head">
      <span class="day-title" id="sc-day-title">—</span>
      <label class="day-chk"><input type="checkbox" id="sc-day-done"> done</label>
    </div>
    <textarea id="sc-day-text" placeholder="what's this day for…" spellcheck="false"></textarea>

    <div class="day-tasks">
      <p class="tasks-h">checklist</p>
      <div class="task-add">
        <input type="text" id="sc-task-input" placeholder="add a task…" spellcheck="false">
        <button type="button" id="sc-task-add">+ add</button>
      </div>
      <ul class="task-list" id="sc-task-list"></ul>
    </div>

    <div class="day-foot">
      <button type="button" class="day-clear" id="sc-day-clear">clear day</button>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = 'sched-v1';
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DOWFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  var els = {
    prev: document.getElementById('sc-prev'),
    next: document.getElementById('sc-next'),
    today: document.getElementById('sc-today'),
    label: document.getElementById('sc-label'),
    month: document.getElementById('sc-month'),
    grid: document.getElementById('sc-grid'),
    week: document.getElementById('sc-week'),
    day: document.getElementById('sc-day'),
    dayTitle: document.getElementById('sc-day-title'),
    dayDone: document.getElementById('sc-day-done'),
    dayText: document.getElementById('sc-day-text'),
    dayClear: document.getElementById('sc-day-clear'),
    taskInput: document.getElementById('sc-task-input'),
    taskAdd: document.getElementById('sc-task-add'),
    taskList: document.getElementById('sc-task-list'),
    viewBtns: Array.prototype.slice.call(document.querySelectorAll('[data-view]'))
  };

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { entries: {} }; } catch (e) { return { entries: {} }; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  var state = load();
  state.entries = state.entries || {};

  var view = 'month';
  var cursor = new Date();
  cursor.setHours(0, 0, 0, 0);

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function addMonths(d, n) { var x = new Date(d); x.setMonth(x.getMonth() + n); return x; }
  function startOfWeek(d) { return addDays(d, -d.getDay()); }
  function today() { var t = new Date(); t.setHours(0, 0, 0, 0); return t; }
  function isSame(a, b) { return iso(a) === iso(b); }

  function getEntry(d) {
    return state.entries[iso(d)] || { text: '', done: false, tasks: [] };
  }
  function setEntry(d, patch) {
    var k = iso(d);
    var cur = state.entries[k] || { text: '', done: false, tasks: [] };
    var next = {
      text: patch.text !== undefined ? patch.text : cur.text,
      done: patch.done !== undefined ? patch.done : cur.done,
      tasks: patch.tasks !== undefined ? patch.tasks : (cur.tasks || [])
    };
    var hasContent = next.text.trim() || next.done || next.tasks.length;
    if (!hasContent) { delete state.entries[k]; } else { state.entries[k] = next; }
    save();
  }
  function taskBadge(e) {
    if (e.done) return '✓';
    if (e.tasks && e.tasks.length) {
      var c = e.tasks.filter(function (t) { return t.done; }).length;
      return c + '/' + e.tasks.length;
    }
    if (e.text) return '•';
    return '';
  }

  function setView(v) {
    view = v;
    els.viewBtns.forEach(function (b) { b.classList.toggle('active', b.dataset.view === v); });
    els.month.hidden = v !== 'month';
    els.week.hidden = v !== 'week';
    els.day.hidden = v !== 'day';
    render();
  }

  function navigate(delta) {
    if (view === 'month') cursor = addMonths(cursor, delta);
    else if (view === 'week') cursor = addDays(cursor, 7 * delta);
    else cursor = addDays(cursor, delta);
    render();
  }

  function goToDay(d) {
    cursor = new Date(d);
    setView('day');
  }

  function renderLabel() {
    if (view === 'month') {
      els.label.textContent = MONFULL[cursor.getMonth()] + ' ' + cursor.getFullYear();
    } else if (view === 'week') {
      var s = startOfWeek(cursor), e = addDays(s, 6);
      els.label.textContent = MON[s.getMonth()] + ' ' + s.getDate() + ' – ' + MON[e.getMonth()] + ' ' + e.getDate() + ', ' + e.getFullYear();
    } else {
      els.label.textContent = DOWFULL[cursor.getDay()] + ', ' + cursor.getDate() + ' ' + MON[cursor.getMonth()] + ' ' + cursor.getFullYear();
    }
  }

  function renderMonth() {
    var first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    var start = startOfWeek(first);
    var t = today();
    els.grid.innerHTML = '';
    for (var i = 0; i < 42; i++) {
      var d = addDays(start, i);
      var cell = document.createElement('div');
      cell.className = 'cell';
      if (d.getMonth() !== cursor.getMonth()) cell.classList.add('other');
      if (isSame(d, t)) cell.classList.add('today');
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = d.getDate();
      cell.appendChild(num);
      var e = getEntry(d);
      var badge = taskBadge(e);
      if (badge) { var mk = document.createElement('span'); mk.className = 'mark'; mk.textContent = badge; cell.appendChild(mk); }
      if (e.text) {
        var snip = document.createElement('div');
        snip.className = 'snip';
        snip.textContent = e.text.split('\n')[0];
        cell.appendChild(snip);
      }
      (function (date) { cell.addEventListener('click', function () { goToDay(date); }); })(d);
      els.grid.appendChild(cell);
    }
    // only render 6 rows if the 6th row has any current-month days, else trim to 5 rows for compactness
    var sixthRowStart = addDays(start, 35);
    if (sixthRowStart.getMonth() !== cursor.getMonth()) {
      for (var r = 0; r < 7; r++) { if (els.grid.lastChild) els.grid.removeChild(els.grid.lastChild); }
    }
  }

  function renderWeek() {
    var s = startOfWeek(cursor);
    var t = today();
    els.week.innerHTML = '';
    for (var i = 0; i < 7; i++) {
      var d = addDays(s, i);
      var e = getEntry(d);
      var row = document.createElement('div');
      row.className = 'wrow' + (isSame(d, t) ? ' today' : '');

      var taskFrac = '';
      if (e.tasks && e.tasks.length) {
        var doneCount = e.tasks.filter(function (t) { return t.done; }).length;
        taskFrac = ' <span class="badge">' + doneCount + '/' + e.tasks.length + '</span>';
      }
      var dayCol = document.createElement('div');
      dayCol.className = 'wday';
      dayCol.innerHTML = '<div class="dow">' + DOW[d.getDay()] + '</div><div class="dnum">' + MON[d.getMonth()] + ' ' + d.getDate() + taskFrac + '</div>';
      dayCol.addEventListener('click', (function (date) { return function () { goToDay(date); }; })(d));

      var input = document.createElement('input');
      input.className = 'wtext';
      input.type = 'text';
      input.spellcheck = false;
      input.placeholder = 'what’s this day for…';
      input.value = e.text;
      input.addEventListener('change', (function (date, inp) { return function () { setEntry(date, { text: inp.value }); }; })(d, input));

      var chk = document.createElement('input');
      chk.className = 'wdone';
      chk.type = 'checkbox';
      chk.checked = e.done;
      chk.title = 'done';
      chk.addEventListener('change', (function (date, box) { return function () { setEntry(date, { done: box.checked }); }; })(d, chk));

      row.appendChild(dayCol);
      row.appendChild(input);
      row.appendChild(chk);
      els.week.appendChild(row);
    }
  }

  function renderDay() {
    var e = getEntry(cursor);
    els.dayTitle.textContent = DOWFULL[cursor.getDay()] + ', ' + cursor.getDate() + ' ' + MON[cursor.getMonth()];
    els.dayDone.checked = e.done;
    els.dayText.value = e.text;
    renderTasks(e.tasks || []);
  }

  function renderTasks(tasks) {
    els.taskList.innerHTML = '';
    tasks.forEach(function (task) {
      var li = document.createElement('li');
      if (task.done) li.classList.add('done');

      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = task.done;
      chk.addEventListener('change', function () { toggleTask(task.id, chk.checked); });

      var label = document.createElement('span');
      label.className = 'tt';
      label.textContent = task.text;
      label.addEventListener('click', function () { toggleTask(task.id, !task.done); });

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'tdel';
      del.textContent = '✕';
      del.title = 'remove task';
      del.addEventListener('click', function () { deleteTask(task.id); });

      li.appendChild(chk);
      li.appendChild(label);
      li.appendChild(del);
      els.taskList.appendChild(li);
    });
  }

  function currentTasks() { return (getEntry(cursor).tasks || []).slice(); }

  function addTask() {
    var text = els.taskInput.value.trim();
    if (!text) return;
    var tasks = currentTasks();
    tasks.push({ id: 't' + Date.now() + Math.random().toString(36).slice(2, 6), text: text, done: false });
    setEntry(cursor, { tasks: tasks });
    els.taskInput.value = '';
    renderTasks(tasks);
  }
  function toggleTask(id, done) {
    var tasks = currentTasks();
    tasks.forEach(function (t) { if (t.id === id) t.done = done; });
    setEntry(cursor, { tasks: tasks });
    renderTasks(tasks);
  }
  function deleteTask(id) {
    var tasks = currentTasks().filter(function (t) { return t.id !== id; });
    setEntry(cursor, { tasks: tasks });
    renderTasks(tasks);
  }

  els.taskAdd.addEventListener('click', addTask);
  els.taskInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addTask(); } });

  els.dayText.addEventListener('change', function () { setEntry(cursor, { text: els.dayText.value }); });
  els.dayDone.addEventListener('change', function () { setEntry(cursor, { done: els.dayDone.checked }); });
  els.dayClear.addEventListener('click', function () {
    if (!confirm('Clear this day’s entry?')) return;
    delete state.entries[iso(cursor)];
    save();
    renderDay();
  });

  function render() {
    renderLabel();
    if (view === 'month') renderMonth();
    else if (view === 'week') renderWeek();
    else renderDay();
  }

  els.prev.addEventListener('click', function () { navigate(-1); });
  els.next.addEventListener('click', function () { navigate(1); });
  els.today.addEventListener('click', function () { cursor = today(); render(); });
  els.viewBtns.forEach(function (b) { b.addEventListener('click', function () { setView(b.dataset.view); }); });

  setView('month');
})();
</script>

<!doctype html>
<!-- 100-day tracker -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>100 days</title>
<style>
  :root{
    --bg:#0f0f0f; --fg:#e7e7e7; --muted:#8f8f8f;
    --line:#2d2d2d; --accent:#e5484b; --accent-ink:#0f0f0f;
    /* fonts a page item or document can switch between; all built in, nothing downloads */
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  /* the hidden attribute always wins over display rules set below */
  [hidden]{display:none !important;}
  html{font-size:16px;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--mono);
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px; margin:0 auto; padding:3rem 1rem 5rem;}

  header{border-bottom:2px solid var(--fg); padding-bottom:1rem; margin-bottom:2rem;}
  .tk-title{display:block; width:100%; margin:0; padding:0; background:transparent; border:none;
    outline:none; color:var(--fg); font:inherit; font-size:2rem; font-weight:700; letter-spacing:.08em;}
  .tk-title::placeholder{color:var(--line);}
  .sub{
    display:block; width:100%; margin-top:.6rem; padding:.35rem 0;
    background:transparent; border:none; border-bottom:2px solid var(--line);
    color:var(--muted); font:inherit; font-size:.85rem; letter-spacing:.12em;
    text-transform:uppercase; outline:none;
  }
  .sub:focus{border-bottom-color:var(--accent); color:var(--fg);}

  .stats{
    display:flex; align-items:baseline; gap:1rem; justify-content:space-between;
    margin-bottom:1.25rem; font-size:.85rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted);
  }
  .count{font-size:1.5rem; color:var(--fg); letter-spacing:.04em;}
  .count b{color:var(--accent);}
  .bar{height:10px; border:2px solid var(--fg); margin-bottom:2rem; position:relative;}
  .bar > i{display:block; height:100%; background:var(--accent); width:0;
    transition:width .18s ease;}
  .stats .right{display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap;}
  .stats .right b{color:var(--fg); font-weight:700;}

  .when{
    display:flex; justify-content:space-between; align-items:center; gap:1rem;
    flex-wrap:wrap; margin:-1rem 0 2rem; font-size:.72rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
  }
  .when label{display:flex; align-items:center; gap:.5rem;}
  .when input{
    background:transparent; border:2px solid var(--line); color:var(--fg);
    font:inherit; font-size:.72rem; padding:.2rem .4rem; outline:none;
    border-radius:0; color-scheme:dark;
  }
  .when input:focus{border-color:var(--accent);}
  .when-l{display:flex; gap:1rem; flex-wrap:wrap;}
  .when input[type=number]{width:4.8rem;}
  /* start date and length are rarely needed once set: they show on hovering the row or while editing */
  .len-field{opacity:0; transition:opacity .12s;}
  .when:hover .len-field, .len-field:focus-within{opacity:1;}
  @media (hover:none){ .len-field{opacity:.5;} }
  .grid.dense{gap:4px;}
  .grid.dense .cell{font-size:.6rem;}
  .when b{color:var(--accent); font-weight:700;}

  .layout{display:flex; gap:1.5rem; align-items:flex-start;}
  .grid-col{flex:1 1 auto; min-width:0;}
  .side{flex:0 0 250px; display:flex; flex-direction:column; gap:1.25rem;}
  .stickies{display:flex; flex-direction:column; gap:1.25rem;}

  .grid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px;}
  .cell{
    position:relative; aspect-ratio:1/1; border:2px solid var(--line);
    background:transparent; color:var(--muted); font:inherit; font-size:.72rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0; transition:background .1s ease,border-color .1s ease,color .1s ease;
  }
  .cell{touch-action:manipulation; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;}
  .cell:hover{border-color:var(--fg); color:var(--fg);}
  .cell.done{background:var(--accent); border-color:var(--accent);
    color:var(--accent-ink); font-weight:700;}
  .cell.today{box-shadow:inset 0 0 0 2px var(--fg);}
  .cell.sel{outline:2px solid var(--fg); outline-offset:2px;}
  .cell.note::after{
    content:""; position:absolute; top:3px; right:3px; width:5px; height:5px;
    background:var(--accent);
  }
  .cell.done.note::after{background:var(--accent-ink);}
  .cell:focus-visible{outline:2px solid var(--fg); outline-offset:2px;}

  /* ---- note card ---- */
  .panel{border:2px solid var(--line); padding:.85rem; background:var(--bg);}
  .panel.pinned{border-left:5px solid var(--accent);}
  .panel h2{
    margin:0 0 .55rem; font-size:.72rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); font-weight:700;
    display:flex; align-items:center; gap:.5rem;
  }
  .ck{
    flex:0 0 auto; width:15px; height:15px; border:2px solid var(--line);
    background:transparent; cursor:pointer; padding:0; display:inline-flex;
    align-items:center; justify-content:center; line-height:1; color:var(--accent-ink);
    font-size:.7rem;
  }
  .ck:hover{border-color:var(--fg);}
  .ck.on{background:var(--accent); border-color:var(--accent);}
  .ck[hidden]{display:none;}
  .prog{flex:0 0 auto; color:var(--accent); letter-spacing:.06em;}
  .nav{
    flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; font-size:.95rem; line-height:1; padding:0 .15rem;
  }
  .nav:hover{color:var(--fg);}
  .card-hint{margin:-.3rem 0 .4rem; font-size:.62rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--line);}
  .card-date{color:var(--muted);}
  .card-plan{color:var(--muted);}
  .plan-head{display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap;}
  .plan-head button{background:transparent; border:none; padding:0; font:inherit; color:var(--muted); text-decoration:underline; cursor:pointer;}
  .plan-head button:hover{color:var(--accent);}
  .plan-items{display:flex; flex-direction:column; gap:.25rem; margin-top:.55rem;}
  .plan-item{display:flex; align-items:center; gap:.5rem; border-left:3px solid var(--line); padding:.15rem 0 .15rem .45rem;
    font-size:.72rem; color:var(--fg); text-transform:none; letter-spacing:0; min-width:0;}
  .plan-ck{flex:0 0 auto; width:14px; height:14px; padding:0; border:2px solid var(--fg); background:transparent; color:var(--accent-ink);
    font:inherit; font-size:.55rem; line-height:10px; text-align:center; cursor:pointer;}
  .plan-ck.on{background:var(--accent); border-color:var(--accent);}
  .plan-time{flex:0 0 auto; color:var(--muted); font-size:.62rem; font-variant-numeric:tabular-nums; min-width:4.6rem;}
  .plan-title{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .plan-item.done .plan-title{text-decoration:line-through; color:var(--muted);}
  .plan-item.allday .plan-time{text-transform:uppercase; letter-spacing:.06em; font-size:.55rem;}
  .ttl-input{
    flex:1 1 auto; min-width:0; background:transparent; border:none; outline:none;
    font:inherit; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); font-weight:700; padding:0;
  }
  .ttl-input::placeholder{color:var(--line);}
  .ttl-input:focus{color:var(--fg);}
  .ttl-input.done{text-decoration:line-through; color:var(--muted);}
  .ttl-input[readonly]{color:var(--muted); cursor:default;}
  .pin, .del{
    flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; line-height:1; padding:0 .15rem;
  }
  .pin{font-size:.85rem;}
  .pin:hover{color:var(--fg);}
  .pin.on{color:var(--accent);}
  .del{font-size:.9rem;}
  .del:hover{color:var(--accent);}

  /* ---- note body: iphone-style lines ---- */
  .blocks{display:flex; flex-direction:column;}
  .blk{display:flex; align-items:center; gap:.5rem; padding:.12rem 0;}
  .blk-text{
    flex:1 1 auto; min-width:0; background:transparent; border:none;
    color:var(--fg); font:inherit; font-size:.82rem; padding:.1rem 0; outline:none;
  }
  .blk-text::placeholder{color:var(--line);}
  .blk-text.done{text-decoration:line-through; color:var(--muted);}
  .bdel{
    flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; font-size:.85rem; line-height:1; padding:0 .15rem;
    opacity:0; transition:opacity .1s;
  }
  .blk:hover .bdel{opacity:.6;}
  .bdel:hover{opacity:1; color:var(--accent);}
  /* block styles from the slash menu */
  .bt-h .blk-text{font-size:1rem; font-weight:700; letter-spacing:.02em;}
  .bt-quote{border-left:3px solid var(--fg); padding-left:.6rem; margin:.2rem 0;}
  .bt-quote .blk-text{font-style:italic;}
  .bt-callout{border:2px solid var(--line); background:#161616;
    padding:.35rem .5rem; margin:.25rem 0;}
  .blk-icon{flex:0 0 auto; color:var(--accent); font-weight:700; width:15px; text-align:center;}
  .bt-divider hr{flex:1 1 auto; border:none; border-top:2px solid var(--line); margin:.55rem 0;}
  .blk-img{display:block; flex:1 1 auto; min-width:0; max-width:100%; height:auto;
    border:2px solid var(--line); margin:.25rem 0;}
  .slash{position:fixed; z-index:100; min-width:220px; padding:.25rem 0;
    background:var(--bg); border:2px solid var(--fg); box-shadow:6px 6px 0 var(--line);}
  .slash-item{display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
    padding:.3rem .65rem; font-size:.75rem; letter-spacing:.06em; cursor:pointer;}
  .slash-item small{color:var(--muted); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;}
  .slash-item.on{background:var(--accent); color:var(--accent-ink);}
  .slash-item.on small{color:var(--accent-ink);}
  .toast{position:fixed; left:50%; bottom:1rem; transform:translateX(-50%); z-index:200;
    max-width:calc(100vw - 2rem); background:var(--accent); color:var(--accent-ink);
    padding:.55rem .9rem; font-size:.72rem; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase;}
  /* a note's ⋯ menu: per-note options (for now, the cross-off checkbox) */
  .nmore{flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; font-size:.85rem; line-height:1; padding:0 .15rem;}
  .nmore:hover, .nmore.on{color:var(--fg);}
  .nmenu{position:fixed; z-index:95;}

  .addnote{
    background:transparent; border:2px dashed var(--line); color:var(--muted);
    font:inherit; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.6rem; cursor:pointer; width:100%;
  }
  .addnote:hover{border-color:var(--accent); color:var(--accent);}

  footer{margin-top:2.5rem; display:flex; justify-content:space-between;
    align-items:center; gap:1rem; flex-wrap:wrap;
    border-top:2px solid var(--line); padding-top:1.25rem;}
  .tools{display:flex; gap:.5rem; flex-wrap:wrap;}
  .reset, .btn{
    background:transparent; border:2px solid var(--line); color:var(--muted);
    font:inherit; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.45rem .8rem; cursor:pointer;
  }
  .reset:hover, .btn:hover{border-color:var(--accent); color:var(--accent);}
  .reset.armed{border-color:var(--accent); color:var(--accent-ink);
    background:var(--accent); font-weight:700;}
  .hint{font-size:.72rem; letter-spacing:.08em; color:var(--muted);
    text-transform:uppercase;}
  .backup.stale{color:var(--accent); font-weight:700;}
  .hint .touch{display:none;}
  @media (hover:none){ .hint .mouse{display:none;} .hint .touch{display:inline;} }


  /* free-floating page items, added from the + in the corner */
  #pageItems{position:absolute; top:0; left:0; right:0; height:0; z-index:5;}
  /* a page item's text sizes are in em off its own font-size, so the Aa size
     scales everything inside it; its controls stay rem and mono */
  .pitem{position:absolute; min-width:120px; font-size:16px;}
  .pitem:hover, .pitem.active, .pitem:focus-within{outline:2px dashed var(--line); outline-offset:4px;}
  .pi-text{display:block; width:100%; background:transparent; border:none; outline:none;
    resize:none; overflow:hidden; color:var(--fg); font:inherit; font-size:.85em;
    line-height:1.55; padding:0;}
  .pi-text::placeholder{color:var(--line);}
  .pi-h .pi-text{font-size:1.5em; font-weight:700; letter-spacing:.04em; line-height:1.25;}
  .pi-quote{background:#161616; border:2px solid var(--line); border-left:4px solid var(--fg);
    padding:.85rem 1rem;}
  .pi-quote .pi-text{font-style:italic;}
  .pi-callout{display:flex; gap:.6rem; align-items:flex-start; background:#161616;
    border:2px solid var(--line); padding:.75rem .9rem;}
  .pi-icon{flex:0 0 auto; color:var(--accent); font-weight:700; line-height:1.55;}
  /* page photos sit in a frame that crops; layoutPhoto() sizes and offsets the img */
  .pi-frame{position:relative; overflow:hidden; border:2px solid var(--line);}
  .pi-frame img{position:absolute; left:0; top:0; max-width:none; display:block;
    user-select:none; -webkit-user-drag:none; pointer-events:none;}
  .pi-image.cropping .pi-frame{border-color:var(--accent); cursor:grab; touch-action:none;}
  .pi-image.cropping.panning .pi-frame{cursor:grabbing;}
  .pi-crop, .pi-fit{background:transparent; border:none; color:var(--fg); font:inherit;
    font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; padding:.25rem .35rem;
    cursor:pointer;}
  .pi-crop:hover, .pi-fit:hover{color:var(--accent);}
  .pi-crop.on{background:var(--accent); color:var(--accent-ink);}
  .pi-image:not(.cropping) .pi-fit{display:none;}
  .pi-image.cropping .pi-ctl{opacity:1;}
  .pi-image.cropping .pi-size{display:none;}
  .pi-ctl{position:absolute; top:-.2rem; right:14px; display:flex; gap:.15rem; font-family:var(--mono);
    background:var(--bg); border:2px solid var(--fg); opacity:0; transition:opacity .1s;}
  .pitem:hover .pi-ctl, .pitem.active .pi-ctl, .pitem:focus-within .pi-ctl{opacity:1;}
  .pi-grip, .pi-del{background:transparent; border:none; color:var(--fg); font:inherit;
    font-size:.8rem; line-height:1; padding:.25rem .35rem;}
  .pi-grip{cursor:move; touch-action:none;}
  .pi-del{cursor:pointer;}
  .pi-bw{background:transparent; border:none; color:var(--fg); font:inherit; font-size:.6rem;
    letter-spacing:.08em; text-transform:uppercase; padding:.25rem .35rem; cursor:pointer;}
  .pi-bw:hover{color:var(--accent);}
  .pi-bw.on{background:var(--accent); color:var(--accent-ink);}
  .pi-del:hover{color:var(--accent);}
  /* a resize handle on every corner; text items only change width */
  .pi-size{position:absolute; width:12px; height:12px; z-index:2;
    background:var(--fg); border:2px solid var(--bg); cursor:ew-resize; touch-action:none;
    opacity:0;}
  .pi-size[data-dir=nw]{left:-6px; top:-6px;}
  .pi-size[data-dir=ne]{right:-6px; top:-6px;}
  .pi-size[data-dir=sw]{left:-6px; bottom:-6px;}
  .pi-size[data-dir=se]{right:-6px; bottom:-6px;}
  .pi-image .pi-size[data-dir=nw], .pi-image .pi-size[data-dir=se]{cursor:nwse-resize;}
  .pi-image .pi-size[data-dir=ne], .pi-image .pi-size[data-dir=sw]{cursor:nesw-resize;}
  .pitem:hover .pi-size, .pitem.active .pi-size{opacity:1;}
  .addpage{position:fixed; right:1rem; bottom:1rem; z-index:60; width:2.4rem; height:2.4rem;
    background:var(--bg); border:2px solid var(--fg); color:var(--fg); font:inherit;
    font-size:1.2rem; line-height:1; cursor:pointer;}
  .addpage:hover, .addpage.on{background:var(--accent); border-color:var(--accent);
    color:var(--accent-ink);}
  .page-menu{position:fixed; right:1rem; bottom:3.9rem;}
  .page-menu.at-pointer{right:auto; bottom:auto;}
  .pm-query{padding:.3rem .65rem .4rem; font-size:.72rem; color:var(--accent);
    border-bottom:2px solid var(--line); margin-bottom:.2rem; letter-spacing:.06em;}
  .pm-none{color:var(--muted); cursor:default;}

  /* page cover, Notion style: a full-width banner above everything */
  .cover{position:relative; height:clamp(180px, 30vh, 340px); overflow:hidden;
    border-bottom:2px solid var(--fg);}
  .cover img{display:block; width:100%; height:100%; object-fit:cover;
    user-select:none; -webkit-user-drag:none;}
  .cover.bw img{filter:grayscale(1);}
  .cover.moving{cursor:grab; touch-action:none;}
  .cover.moving.dragging{cursor:grabbing;}
  .cover-size{position:absolute; left:0; right:0; bottom:0; height:12px; z-index:3;
    cursor:ns-resize; touch-action:none;}
  .cover-size::after{content:""; position:absolute; left:50%; bottom:3px; width:56px; height:4px;
    margin-left:-28px; background:var(--fg); opacity:0; transition:opacity .12s;}
  .cover:hover .cover-size::after, .cover.sizing .cover-size::after{opacity:1;}
  .cover.moving .cover-size{display:none;}
  .cover-bar{position:absolute; right:1rem; bottom:1rem; display:flex; gap:.4rem;
    align-items:center; opacity:0; transition:opacity .12s;}
  .cover:hover .cover-bar, .cover.moving .cover-bar{opacity:1;}
  .cover-btn, .cover-hint{background:var(--bg); border:2px solid var(--fg); color:var(--fg);
    font:inherit; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.3rem .55rem;}
  .cover-btn{cursor:pointer;}
  .cover-btn:hover{border-color:var(--accent); color:var(--accent);}
  .cover-btn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .cover-hint{border-color:var(--line); color:var(--muted);}
  .cover:not(.moving) .cover-hint{display:none;}
  /* hidden, not removed: "done" must stay exactly where "reposition" was, or
     the buttons slide and "remove" ends up under the pointer after "done" */
  .cover.moving .cover-btn:not([data-act=move]){visibility:hidden; pointer-events:none;}
  @media (hover:none){ .cover-bar{opacity:1;} }
  .page{position:relative;}
  /* ---- sidebar of pages ---- */
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:240px; z-index:70;
    display:flex; flex-direction:column; padding:.8rem .6rem;
    background:#0b0b0b; border-right:2px solid var(--line);}
  .sb-head{display:flex; justify-content:space-between; align-items:center;
    padding:0 .4rem .7rem; font-size:.65rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);}
  .sb-close{background:transparent; border:none; color:var(--muted); font:inherit;
    font-size:.95rem; cursor:pointer; padding:0 .2rem;}
  .sb-close:hover{color:var(--fg);}
  .sb-open{position:fixed; left:.6rem; top:.6rem; z-index:69; display:none;
    width:2.1rem; height:2.1rem; background:var(--bg); border:2px solid var(--line);
    color:var(--fg); font:inherit; font-size:.95rem; cursor:pointer;}
  .sb-open:hover{border-color:var(--fg);}
  .sb-list{flex:1 1 auto; overflow:auto; display:flex; flex-direction:column; gap:2px;}
  .sb-item{display:flex; align-items:center; gap:.55rem; padding:.38rem .45rem;
    border:2px solid transparent; color:var(--fg); font-size:.78rem; cursor:pointer;}
  .sb-item:hover, .sb-item:focus-visible{background:#161616; outline:none;}
  .sb-item.on{background:#161616; border-color:var(--line);}
  .sb-ico{flex:0 0 18px; width:18px; height:18px; display:inline-flex; align-items:center;
    justify-content:center; font-size:.9rem; line-height:1; color:var(--muted); overflow:hidden;}
  .sb-ico img{width:100%; height:100%; object-fit:cover;}
  .sb-title{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sb-title.empty{color:var(--muted);}
  .sb-del{flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    font:inherit; font-size:.8rem; cursor:pointer; padding:0 .2rem; opacity:0;}
  .sb-item:hover .sb-del, .sb-del.armed{opacity:1;}
  .sb-del:hover{color:var(--accent);}
  .sb-del.armed{color:var(--accent); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase;}
  .sb-new{margin-top:.6rem; background:transparent; border:2px dashed var(--line);
    color:var(--muted); font:inherit; font-size:.68rem; letter-spacing:.1em;
    text-transform:uppercase; padding:.55rem; cursor:pointer;}
  .sb-new:hover{border-color:var(--accent); color:var(--accent);}
  .sb-foot{margin-top:.7rem; padding-top:.7rem; border-top:2px solid var(--line);}
  .sb-tools{display:flex; gap:.4rem;}
  .sb-tools .btn{flex:1 1 0; padding:.35rem .4rem; font-size:.62rem;}
  .sb-foot .backup{display:block; margin-top:.5rem; font-size:.6rem;}
  .sb-tools .btn.on{border-color:var(--accent); color:var(--accent);}
  .sync-pop{position:fixed; z-index:96; width:300px; padding:.7rem;
    background:var(--bg); border:2px solid var(--fg); box-shadow:6px 6px 0 var(--line);}
  .sp-head{font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem;}
  .sync-pop label{display:block; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:.5rem;}
  .sync-pop input{display:block; width:100%; margin-top:.25rem; background:transparent;

<script>
// ---------- storage ----------
// Everything is saved to IndexedDB, which has room for photos and covers
// (localStorage only gives the whole rask0l.github.io origin about 5MB, and
// filling it used to make saves fail so a refresh brought back old data).
// A small state is also mirrored to localStorage, so a refresh that lands
// mid-write still finds the latest copy; on load the newest copy wins.
var STORE = (function(){
  "use strict";
  var dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      if(!window.indexedDB){ rej(new Error("no IndexedDB")); return; }
      var rq = indexedDB.open("hundred", 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore("kv"); };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
      rq.onblocked = function(){ rej(new Error("IndexedDB blocked")); };
    });
    return dbp;
  }
  function get(k){
    return open().then(function(db){ return new Promise(function(res, rej){
      var r = db.transaction("kv", "readonly").objectStore("kv").get(k);
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }); });
  }
  function put(k, v){
    return open().then(function(db){ return new Promise(function(res, rej){
      var tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
      tx.onabort = function(){ rej(tx.error || new Error("write aborted")); };
    }); });
  }
  function keys(){
    return open().then(function(db){ return new Promise(function(res, rej){
      var r = db.transaction("kv", "readonly").objectStore("kv").getAllKeys();
      r.onsuccess = function(){ res(r.result || []); };
      r.onerror = function(){ rej(r.error); };
    }); });
  }
  function del(k){
    return open().then(function(db){ return new Promise(function(res, rej){
      var tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").delete(k);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
      tx.onabort = function(){ rej(tx.error || new Error("delete aborted")); };
    }); });
  }
  return { get:get, put:put, keys:keys, del:del };
})();

(function(){
  var ls = null, done = false;
  try{ ls = localStorage.getItem("hundred-v1"); }catch(e){}
  function go(idbRaw, idbOk){
    if(done) return; done = true; clearTimeout(timer);
    if(idbOk){ try{ sessionStorage.removeItem("hundred-late"); }catch(e){} }
    app({ idb:idbRaw, ls:ls, idbOk:idbOk });
  }
  // if IndexedDB never answers, start on localStorage and never write to
  // IndexedDB this session (it might hold newer data we could not read)
  var timer = setTimeout(function(){ go(undefined, false); }, 5000);
  STORE.get("hundred-v1").then(function(v){
    if(!done){ go(v, true); return; }
    // it answered after all (a slow or stuck first open): reload once to use it.
    // The session flag stops a page that is always slow from reloading forever.
    try{ if(sessionStorage.getItem("hundred-late")) return; sessionStorage.setItem("hundred-late", "1"); }catch(e){ return; }
    location.reload();
  }, function(){ go(undefined, false); });
})();

function app(BOOT){
  "use strict";
  var KEY = "hundred-v1";
  function uid(){ return "n" + Math.random().toString(36).slice(2,9); }

  // block types; divider and image carry no text, an image keeps its picture in src
  var BLOCK_TYPES = ["text","todo","h","quote","callout","divider","image"];
  function normType(t){ return BLOCK_TYPES.indexOf(t) >= 0 ? t : "text"; }
  function hasText(t){ return t !== "divider" && t !== "image"; }
  function okSrc(src){ return typeof src === "string" && /^(data:image\/|https?:\/\/)/.test(src); }
  function mkBlock(type, text, done){
    return { id:uid(), type:normType(type), text:String(text||""), done:!!done };
  }
  function normBlocks(arr){
    if(!Array.isArray(arr)) return null;
    var out = arr.map(function(b){
      var o = { id:String(b && b.id || uid()), type:normType(b && b.type),
                text:String(b && b.text || ""), done:!!(b && b.done) };
      if(o.type === "image"){ if(okSrc(b.src)) o.src = b.src; else o.type = "text"; }
      return o;
    });
    return out.length ? out : [mkBlock("text","",false)];

  function focusEnd(inp){ inp.focus(); var l=inp.value.length; try{ inp.setSelectionRange(l,l); }catch(e){} }
  function insertAfter(node, ref){ ref.parentNode.insertBefore(node, ref.nextSibling); }


  // ---------- slash menu: "/" at the start of a line picks a block type ----------
  var SLASH = [
    { type:"text",    label:"text",      hint:"plain line",       keys:"text plain line paragraph" },
    { type:"todo",    label:"checklist", hint:"tick-box item",    keys:"checklist todo task check" },
    { type:"h",       label:"heading",   hint:"big bold line",    keys:"heading title header h1" },
    { type:"quote",   label:"quote",     hint:"line with a bar",  keys:"quote cite" },
    { type:"callout", label:"tip box",   hint:"highlighted note", keys:"tip box callout note info" },
    { type:"divider", label:"divider",   hint:"horizontal line",  keys:"divider line hr separator" },
    { type:"image",   label:"photo",     hint:"from your device", keys:"photo image picture pic" }
  ];
  var slash = { el:null, input:null, items:[], idx:0, pick:null };
  // best match first: name starts with it, then a keyword does, then the name contains it
  function slashMatches(q){
    q = q.toLowerCase().replace(/^\s+/, "");
    if(!q) return SLASH.slice();
    var scored = [];
    SLASH.forEach(function(c, i){
      var sc = c.label.indexOf(q) === 0 ? 0
             : c.keys.split(" ").some(function(k){ return k.indexOf(q) === 0; }) ? 1
             : c.label.indexOf(q) >= 0 ? 2 : -1;
      if(sc >= 0) scored.push({ c:c, sc:sc, i:i });
    });
    scored.sort(function(a, b){ return a.sc - b.sc || a.i - b.i; });
    return scored.map(function(x){ return x.c; });
  }
  function slashClose(){
    if(slash.el && slash.el.parentNode) slash.el.parentNode.removeChild(slash.el);
    slash.el = slash.input = slash.pick = null; slash.items = []; slash.idx = 0;
  }
  function slashRender(){
    var el = slash.el;
    el.innerHTML = "";
    slash.items.forEach(function(c, i){
      var it = document.createElement("div");
      it.className = "slash-item" + (i === slash.idx ? " on" : "");
      var name = document.createElement("span"); name.textContent = c.label;
      var hint = document.createElement("small"); hint.textContent = c.hint;
      it.appendChild(name); it.appendChild(hint);
      // mousedown, not click, so the line keeps focus
      it.addEventListener("mousedown", function(e){ e.preventDefault(); slashChoose(i); });
      el.appendChild(it);
    });
    var r = slash.input.getBoundingClientRect();
    el.style.left = Math.max(Math.min(r.left, window.innerWidth - el.offsetWidth - 8), 4) + "px";
    var below = r.bottom + 4;
    el.style.top = (below + el.offsetHeight > window.innerHeight
                    ? Math.max(r.top - el.offsetHeight - 4, 4) : below) + "px";
  }
  function slashUpdate(input, pick){
    var v = input.value;
    if(v.charAt(0) !== "/"){ if(slash.input === input) slashClose(); return; }
    var items = slashMatches(v.slice(1));
    if(!items.length){ if(slash.input === input) slashClose(); return; }
    if(slash.input !== input){
      slashClose();
      slash.el = document.createElement("div");
      slash.el.className = "slash"; slash.el.setAttribute("role","listbox");
      document.body.appendChild(slash.el);
      slash.input = input;
    }
    slash.pick = pick; slash.items = items;
    slash.idx = Math.max(0, Math.min(slash.idx, items.length - 1));
    slashRender();
  }
  function slashChoose(i){
    var c = slash.items[i], pick = slash.pick;
    slashClose();
    if(c && pick) pick(c.type);
  }
  // true when the key was used by the open menu
  function slashKey(input, e){
    if(slash.input !== input) return false;
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      var n = slash.items.length;
      slash.idx = (slash.idx + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
      slashRender(); e.preventDefault(); return true;
    }
    if(e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); slashChoose(slash.idx); return true; }
    if(e.key === "Escape"){ e.preventDefault(); slashClose(); return true; }
    return false;
  }
  window.addEventListener("resize", slashClose);
  window.addEventListener("scroll", function(){ if(slash.el) slashRender(); }, true);

  // ---------- photos: shrunk to a JPEG so localStorage can hold them ----------
  var photoInput = document.createElement("input");
  photoInput.type = "file"; photoInput.accept = "image/*"; photoInput.hidden = true;
  document.body.appendChild(photoInput);
  function pickPhoto(cb, maxPx){
    photoInput.value = "";
    photoInput.onchange = function(){
      var f = photoInput.files[0];
      if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var im = new Image();
        im.onload = function(){
          var max = maxPx || 720, big = max >= 1800;
          var sc = Math.min(1, max / Math.max(im.width, im.height));
          // a JPEG/WebP that is already small enough is kept exactly as uploaded:
          // re-encoding it would only add compression artefacts
          if(sc === 1 && /^image\/(jpeg|webp)$/.test(f.type) && f.size <= (big ? 900 : 250) * 1024){
            cb(r.result); return;
          }
          var src = im, w = im.width, h = im.height;
          var tw = Math.max(1, Math.round(w * sc)), th = Math.max(1, Math.round(h * sc));
          // halve in steps first: one big drawImage jump makes a blurry, aliased result
          while(w / 2 >= tw * 1.5){
            var step = document.createElement("canvas");
            step.width = Math.round(w / 2); step.height = Math.round(h / 2);
            var sg = step.getContext("2d");
            sg.imageSmoothingEnabled = true; sg.imageSmoothingQuality = "high";
            sg.drawImage(src, 0, 0, step.width, step.height);
            src = step; w = step.width; h = step.height;
          }
          var c = document.createElement("canvas");
          c.width = tw; c.height = th;
          var g = c.getContext("2d");
          g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
          g.fillStyle = "#0f0f0f"; g.fillRect(0, 0, c.width, c.height);  // transparent PNGs
          g.drawImage(src, 0, 0, c.width, c.height);
          cb(c.toDataURL("image/jpeg", big ? 0.86 : 0.8));
        };
        im.onerror = function(){
          toast("couldn't read that photo");
          setTimeout(function(){ if(!saveFailed) toast(null); }, 3000);
        };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    };
    photoInput.click();
  }

  // ---------- one body line ----------
  var PLACEHOLDER = { text:"write, or / for blocks", todo:"to-do", h:"heading",
                      quote:"quote", callout:"tip" };
  function focusText(row){
    var t = row && row.querySelector(".blk-text");
    if(t){ focusEnd(t); return true; }
    return false;
  }
  // swap a row for a freshly built one (after its block changed type)
  function rerender(opts, block, row, focus){
    var nr = addBlockRow(opts, block, row, focus);
    row.parentNode.removeChild(row);
    return nr;
  }
  // build one body line. opts: {listEl, getBlocks, save, onChange, onCheck}
  function addBlockRow(opts, block, afterRow, focus){
    var t = block.type;
    var row = document.createElement("div");
    row.className = "blk bt-" + t;   // bt-*, not blk-*: .blk-text is the input

    if(t === "divider"){
      row.appendChild(document.createElement("hr"));
    }else if(t === "image"){
      var im = document.createElement("img");
      im.className = "blk-img"; im.src = block.src; im.alt = "";
      row.appendChild(im);
    }

    var ck = null, txt = null;
    if(t === "todo"){
      ck = document.createElement("button");
      ck.type = "button"; ck.className = "ck" + (block.done ? " on" : "");
      ck.setAttribute("aria-label","check item");
      ck.textContent = block.done ? "✓" : "";
      ck.addEventListener("click", function(){
        block.done = !block.done;
        ck.classList.toggle("on", block.done);
        ck.textContent = block.done ? "✓" : "";
        txt.classList.toggle("done", block.done);
        opts.save();
        opts.onCheck && opts.onCheck(block.done);
      });
      row.appendChild(ck);
    }
    if(t === "callout"){
      var icon = document.createElement("span");
      icon.className = "blk-icon"; icon.textContent = "!"; icon.setAttribute("aria-hidden","true");
      row.appendChild(icon);
    }
    if(hasText(t)){
      txt = document.createElement("input");
      txt.type = "text"; txt.className = "blk-text" + (block.done ? " done" : "");
      txt.value = block.text; txt.spellcheck = false;
      txt.placeholder = PLACEHOLDER[t] || "";
      row.appendChild(txt);
    }

    var bdel = document.createElement("button");
    bdel.type = "button"; bdel.className = "bdel"; bdel.textContent = "×";
    bdel.setAttribute("aria-label","delete line");
    row.appendChild(bdel);

    if(afterRow) insertAfter(row, afterRow); else opts.listEl.appendChild(row);

    function changed(){ opts.save(); opts.onChange && opts.onChange(); }
    function addTextAfter(r){
      var blocks = opts.getBlocks();
      var nb = mkBlock("text", "", false);
      blocks.splice(blocks.indexOf(block) + 1, 0, nb);
      addBlockRow(opts, nb, r, true);
    }
    // turn this line into another type, picked from the slash menu
    function convertTo(type){
      block.text = ""; txt.value = "";
      if(type === "image"){
        // the line keeps its type until a photo is actually chosen
        changed();
        pickPhoto(function(src){
          if(!row.parentNode) return;              // line was removed meanwhile
          block.type = "image"; block.src = src; block.done = false;
          var nr = rerender(opts, block, row, false);
          addTextAfter(nr); changed();
        });
        return;
      }
      block.done = false; delete block.src;
      block.type = type;
      var nr = rerender(opts, block, row, hasText(type));
      if(!hasText(type)) addTextAfter(nr);
      changed();
    }

    if(txt){
      txt.addEventListener("input", function(){
        block.text = txt.value;
        if(t === "text" && /^\[\]\s?$/.test(txt.value)){ convertTo("todo"); return; }
        slashUpdate(txt, convertTo);
        changed();
      });
      txt.addEventListener("blur", function(){ if(slash.input === txt) slashClose(); });
      txt.addEventListener("keydown", function(e){
        if(slashKey(txt, e)) return;
        var blocks = opts.getBlocks();
        if(e.key === "Enter"){
          e.preventDefault();
          // Enter on an empty checklist item leaves the list, like Notion
          if(t === "todo" && txt.value === ""){
            block.type = "text"; rerender(opts, block, row, true); changed(); return;
          }
          var nb = mkBlock(t === "todo" ? "todo" : "text", "", false);
          blocks.splice(blocks.indexOf(block) + 1, 0, nb);
          addBlockRow(opts, nb, row, true);
          changed();
        }else if(e.key === "Backspace" && txt.value === "" &&
                 txt.selectionStart === 0 && txt.selectionEnd === 0){
          e.preventDefault();
          // an empty styled line first turns back into plain text
          if(t !== "text"){
            block.type = "text"; block.done = false; rerender(opts, block, row, true); changed(); return;
          }
          if(blocks.length > 1){
            blocks.splice(blocks.indexOf(block), 1);
            var prev = row.previousElementSibling;
            while(prev && !prev.querySelector(".blk-text")) prev = prev.previousElementSibling;
            row.parentNode.removeChild(row);
            focusText(prev);
            changed();
          }
        }
      });
    }
    bdel.addEventListener("click", function(){
      var blocks = opts.getBlocks();
      if(blocks.length > 1){ blocks.splice(blocks.indexOf(block), 1); row.parentNode.removeChild(row); }
      else{
        // the last line never goes away; it just becomes an empty text line
        block.type = "text"; block.text = ""; block.done = false; delete block.src;
        rerender(opts, block, row, false);
      }
      changed();
    });

    if(focus && txt) focusEnd(txt);
    return row;
  }

  function buildBody(panel, opts){
    var list = document.createElement("div");
    list.className = "blocks";
    opts.listEl = list;

    // new lines come from Enter, "/" picks a type, "[]" makes a checklist item
    panel.appendChild(list);
    return list;
  }

  function buildDayCard(){

      onCheck:function(on){

  function refreshDayHead(){
    var d = dateOf(sel);
    dayTitle.value = "DAY " + (sel+1);

    dayDate.hidden = !d;
    var on = T.days[sel];

    // a linked Command Center: what was planned and done that day

    var pl = plannerFor(T);

      head.appendChild(open);

          row.style.borderLeftColor = it.color;

          list.appendChild(row);
        });
        dayPlan.appendChild(list);

    }

  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeNoteMenu(); });
  window.addEventListener("scroll", closeNoteMenu);
  function reorderStickies(){
    var pinned = T.stickies.filter(function(s){ return s.pinned; });
    var rest   = T.stickies.filter(function(s){ return !s.pinned; });

  // ---------- Grid ----------
  function tickDay(idx){
    T.days[idx] = !T.days[idx];
    save(); renderGrid(); refreshDayHead();
  }
  // the grid is rebuilt whenever a different tracker (or length) is shown
  function buildGrid(){
    grid.innerHTML = ""; cells = [];
    var cols = T.n <= 100 ? 10 : T.n <= 196 ? 14 : 20;
    grid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    grid.classList.toggle("dense", cols > 10);
    for(var i=0;i<T.n;i++) makeCell(i);
  }
  function makeCell(i){
    (function(idx){
      var b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.textContent = idx+1;
      b.setAttribute("aria-label","day "+(idx+1));
      // click opens the day; double-click (or long-press on touch) ticks it
      b.addEventListener("click", function(){ if(idx !== sel) selectDay(idx); });
      b.addEventListener("dblclick", function(){ tickDay(idx); });
      var lp = null;
      function cancelLp(){ clearTimeout(lp); lp = null; }
      b.addEventListener("pointerdown", function(e){
        if(e.pointerType !== "touch") return;
        cancelLp();
        lp = setTimeout(function(){
          lp = null;
          if(idx !== sel) selectDay(idx);
          tickDay(idx);
          if(navigator.vibrate) navigator.vibrate(15);
        }, 450);
      });

      });
      fit.addEventListener("click", function(){
        delete it.h; it.zoom = 1; it.px = 0.5; it.py = 0.5;
        layoutPhoto(); save();
      });
      var pan = null;
      frame.addEventListener("pointerdown", function(e){
        if(!cropping || e.button !== 0) return;
        pan = { sx:e.clientX, sy:e.clientY, px:it.px, py:it.py };
        frame.setPointerCapture(e.pointerId); el.classList.add("panning");
        e.preventDefault();
      });
      frame.addEventListener("pointermove", function(e){
        if(!pan) return;
        var o = layoutPhoto();
        // moving the pointer right drags the picture right, so the pan goes left
        if(o.ox > 0) it.px = Math.min(Math.max(pan.px - (e.clientX - pan.sx) / o.ox, 0), 1);
        if(o.oy > 0) it.py = Math.min(Math.max(pan.py - (e.clientY - pan.sy) / o.oy, 0), 1);
        layoutPhoto();
      });
      function endPan(e){
        if(!pan) return; pan = null;
        try{ frame.releasePointerCapture(e.pointerId); }catch(_){}
        el.classList.remove("panning"); save();
      }
      frame.addEventListener("pointerup", endPan);
      frame.addEventListener("pointercancel", endPan);
      // zoom saves once the wheel stops, so one zoom is one undo step (not dozens)
      var zoomT = null;
      frame.addEventListener("wheel", function(e){
        if(!cropping) return;
        e.preventDefault();
        it.zoom = Math.min(Math.max((it.zoom || 1) * Math.exp(-e.deltaY * 0.0015), 1), 4);
        layoutPhoto();
        clearTimeout(zoomT); zoomT = setTimeout(save, 400);
      }, { passive:false });
    }

    function removeItem(){
      cur().items = cur().items.filter(function(x){ return x.id !== it.id; });
      if(el.parentNode) el.parentNode.removeChild(el);
      save();
    }
    del.addEventListener("click", removeItem);
    // Backspace in an empty text box removes it, like an empty block in Notion
    if(ta) ta.addEventListener("keydown", function(e){
      if(e.key === "Backspace" && ta.value === ""){ e.preventDefault(); removeItem(); }
    });

    // an item hanging past the window edge must still show its grip and delete:
    // slide the controls back on screen whenever it is hovered or focused
    function fitCtl(){
      ctl.style.right = ""; ctl.style.left = "";
      var r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth;
      var over = r.right - (vw - 8);
      if(over > 0) ctl.style.right = (14 + over) + "px";
      if(ctl.getBoundingClientRect().left < 8){
        ctl.style.right = ""; ctl.style.left = Math.max(0, 8 - r.left) + "px";
      }
    }
    el.addEventListener("pointerenter", fitCtl);
    el.addEventListener("focusin", fitCtl);

    // grip moves, corner handle resizes (width; height follows the content)
    function gesture(handle, onMove){
      var g = null;
      handle.addEventListener("pointerdown", function(e){
        if(e.button !== 0) return;
        g = { sx:e.clientX, sy:e.clientY, x:it.x, y:it.y, w:it.w,
              h:frame ? frame.offsetHeight : 0 };
        handle.setPointerCapture(e.pointerId); el.classList.add("active");
        e.preventDefault();
      });
      handle.addEventListener("pointermove", function(e){
        if(!g) return;
        onMove(g, e.clientX - g.sx, e.clientY - g.sy);
        placeItem(el, it); if(ta) growText(ta); layoutPhoto();
      });
      function end(e){
        if(!g) return; g = null;
        try{ handle.releasePointerCapture(e.pointerId); }catch(_){}
        el.classList.remove("active"); save();
      }
      handle.addEventListener("pointerup", end);
      handle.addEventListener("pointercancel", end);
    }
    gesture(grip, function(g, dx, dy){ it.x = g.x + dx; it.y = Math.max(0, g.y + dy); });
    // a left or top corner keeps the opposite edge where it is
    sizes.forEach(function(h){
      var d = h.getAttribute("data-dir");
      gesture(h, function(g, dx, dy){
        var w = Math.min(Math.max(g.w + (d.charAt(1) === "w" ? -dx : dx), 120), 1200);
        if(d.charAt(1) === "w") it.x = g.x + (g.w - w);
        it.w = w;
        // photos: corners also set the frame height, cropping instead of squashing
        if(frame){
          var fh = Math.min(Math.max(g.h + (d.charAt(0) === "n" ? -dy : dy), 60), 2400);
          if(d.charAt(0) === "n") it.y = Math.max(0, g.y + (g.h - fh));
          it.h = fh;
        }
      });
    });

    if(focus && ta) ta.focus();
    else if(focus && el.focusFirst) el.focusFirst();
    return el;
  }

  // at: optional { x, y } in page coordinates (x from the centre line) for the
  // item's top-left corner; without it the item lands mid-screen
  function addPageItem(type, at){
    var spec = PAGE_TYPES.filter(function(p){ return p.type === type; })[0];
    var it = { id:uid(), type:type, text:"", w:spec.w,
               x:at ? Math.round(at.x) : -Math.round(spec.w / 2),
               y:at ? Math.max(0, Math.round(at.y)) : Math.round(window.scrollY + window.innerHeight / 3) };
    if(type === "note") it.blocks = [mkBlock("todo","",false)];
    if(type === "countdown") it.date = "";
    function commit(){ cur().items.push(it); save(); buildPageItem(it, true); }
    if(type === "image") pickPhoto(function(src){ it.src = src; commit(); });
    else commit();
  }

  // the page menu: opened by the + in the corner, or by typing "/" anywhere
  // that isn't a text field (then it opens at the pointer, filters as you
  // type, and the new item lands where the pointer was)
  var addPage = document.getElementById("addPage");
  var pageMenu = null, pmItems = [], pmIdx = 0, pmQuery = "", pmAt = null, pmQ = null;
  var lastPointer = null;
  document.addEventListener("mousemove", function(e){ lastPointer = { x:e.clientX, y:e.clientY }; });
  function closePageMenu(){
    if(pageMenu && pageMenu.parentNode) pageMenu.parentNode.removeChild(pageMenu);
    pageMenu = null; pmAt = null; addPage.classList.remove("on");
  }
  function pmMatches(){
    var q = pmQuery.toLowerCase();
    if(!q) return PAGE_TYPES.slice();
    var starts = PAGE_TYPES.filter(function(t){ return t.label.indexOf(q) === 0; });
    var has = PAGE_TYPES.filter(function(t){ return t.label.indexOf(q) > 0; });
    return starts.concat(has);
  }
  function pmChoose(t){
    var at = pmAt;
    closePageMenu();
    if(t) addPageItem(t.type, at);
  }
  function pmRender(){
    pmItems = pmMatches();
    if(pmIdx >= pmItems.length) pmIdx = Math.max(0, pmItems.length - 1);
    pageMenu.innerHTML = "";
    if(pmQ){
      pmQ.textContent = "/" + pmQuery;
      pageMenu.appendChild(pmQ);
    }
    if(!pmItems.length){
      var none = document.createElement("div");
      none.className = "slash-item pm-none"; none.textContent = "no match";
      pageMenu.appendChild(none);
    }
    pmItems.forEach(function(t, k){
      var row = document.createElement("div");
      row.className = "slash-item" + (pmQ && k === pmIdx ? " on" : "");
      var name = document.createElement("span"); name.textContent = t.label;
      var hint = document.createElement("small"); hint.textContent = t.hint;
      row.appendChild(name); row.appendChild(hint);
      row.addEventListener("mousedown", function(e){ e.preventDefault(); });
      row.addEventListener("click", function(e){ e.stopPropagation(); pmChoose(t); });
      pageMenu.appendChild(row);
    });
  }
  function openPageMenu(viaSlash){
    closePageMenu();
    pageMenu = document.createElement("div");
    pageMenu.className = "slash page-menu";
    pmQuery = ""; pmIdx = 0;
    pmQ = null;
    if(viaSlash){
      pmQ = document.createElement("div"); pmQ.className = "pm-query";
      var pt = lastPointer || { x:window.innerWidth / 2, y:window.innerHeight / 3 };
      var r = document.querySelector(".page").getBoundingClientRect();
      pmAt = { x:pt.x - (r.left + r.width / 2), y:pt.y - r.top };
      pageMenu.classList.add("at-pointer");
    }
    pmRender();
    document.body.appendChild(pageMenu);
    if(viaSlash){
      var w = pageMenu.offsetWidth, h = pageMenu.offsetHeight;
      pageMenu.style.left = Math.max(8, Math.min(pt.x, window.innerWidth - w - 8)) + "px";
      pageMenu.style.top = Math.max(8, Math.min(pt.y + 8, window.innerHeight - h - 8)) + "px";
    }else addPage.classList.add("on");
  }
  addPage.addEventListener("click", function(e){
    e.stopPropagation();
    if(pageMenu){ closePageMenu(); return; }
    openPageMenu(false);
  });
  function isTyping(t){
    return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
  }
  document.addEventListener("keydown", function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    // "/" outside any text field opens the menu at the pointer
    if(!pageMenu && e.key === "/" && !isTyping(e.target) && !iconPop && !newPop){
      e.preventDefault(); openPageMenu(true); return;
    }
    if(!pageMenu || !pmQ) return;
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      var n = pmItems.length || 1;
      pmIdx = (pmIdx + (e.key === "ArrowDown" ? 1 : n - 1)) % n; pmRender();
    }else if(e.key === "Enter" || e.key === "Tab"){
      e.preventDefault(); pmChoose(pmItems[pmIdx]);
    }else if(e.key === "Backspace"){
      e.preventDefault();
      if(!pmQuery) closePageMenu(); else { pmQuery = pmQuery.slice(0, -1); pmRender(); }
    }else if(e.key.length === 1 && /[a-z ]/i.test(e.key)){
      e.preventDefault(); pmQuery += e.key.toLowerCase(); pmIdx = 0; pmRender();
    }
  });
  document.addEventListener("click", function(e){
    if(pageMenu && !pageMenu.contains(e.target)) closePageMenu();
  });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    closePageMenu();
    [].forEach.call(pageBox.querySelectorAll(".pi-image"), function(el){ el.stopCrop && el.stopCrop(); });
  });

  function renderItems(){
    pageBox.innerHTML = "";
    cur().items.forEach(function(it){ buildPageItem(it, false); });
  }

  // first paint: build the home tracker once, then show whichever page the URL names
  loadTracker(state);
  renderPage();

  // the calendar day may roll over while the tab sits open
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      renderGrid(); refreshDayHead();
      [].forEach.call(pageBox.querySelectorAll(".pi-countdown"), function(el){ el.repaint && el.repaint(); });
    }
  });

  renderGrid(); refreshDay();
  if(storageLocked) toast(lockWhy === "idb"
    ? "this browser's storage didn't open, so this is an older read-only copy and nothing you change is saved. reload the page to try again"
    : "couldn't read your saved data, so nothing will be saved over it. import a backup, or ask for help before changing anything");
  paintSync();
  if(sync.cfg) syncCheck();
  window.dispatchEvent(new Event("app-ready"));   // the app starts after saved data is read
}
</script>
</body>
</html>

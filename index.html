<!doctype html>
<!-- 100-day tracker -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>100 days</title>
<style>
  :root{
    --bg:#0f0f0f; --fg:#e7e7e7; --muted:#8f8f8f;
    --line:#2d2d2d; --accent:#e5484b; --accent-ink:#0f0f0f;
  }
  *{box-sizing:border-box;}
  /* the hidden attribute always wins over display rules set below */
  [hidden]{display:none !important;}
  html{font-size:16px;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px; margin:0 auto; padding:3rem 1rem 5rem;}

  header{border-bottom:2px solid var(--fg); padding-bottom:1rem; margin-bottom:2rem;}
  h1{font-size:2rem; letter-spacing:.08em; margin:0; font-weight:700;}
  h1 .n{color:var(--accent);}
  .sub{
    display:block; width:100%; margin-top:.6rem; padding:.35rem 0;
    background:transparent; border:none; border-bottom:2px solid var(--line);
    color:var(--muted); font:inherit; font-size:.85rem; letter-spacing:.12em;
    text-transform:uppercase; outline:none;
  }
  .sub:focus{border-bottom-color:var(--accent); color:var(--fg);}

  .stats{
    display:flex; align-items:baseline; gap:1rem; justify-content:space-between;
    margin-bottom:1.25rem; font-size:.85rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted);
  }
  .count{font-size:1.5rem; color:var(--fg); letter-spacing:.04em;}
  .count b{color:var(--accent);}
  .bar{height:10px; border:2px solid var(--fg); margin-bottom:2rem; position:relative;}
  .bar > i{display:block; height:100%; background:var(--accent); width:0;
    transition:width .18s ease;}
  .stats .right{display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap;}
  .stats .right b{color:var(--fg); font-weight:700;}

  .when{
    display:flex; justify-content:space-between; align-items:center; gap:1rem;
    flex-wrap:wrap; margin:-1rem 0 2rem; font-size:.72rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
  }
  .when label{display:flex; align-items:center; gap:.5rem;}
  .when input{
    background:transparent; border:2px solid var(--line); color:var(--fg);
    font:inherit; font-size:.72rem; padding:.2rem .4rem; outline:none;
    border-radius:0; color-scheme:dark;
  }
  .when input:focus{border-color:var(--accent);}
  .when b{color:var(--accent); font-weight:700;}

  .layout{display:flex; gap:1.5rem; align-items:flex-start;}
  .grid-col{flex:1 1 auto; min-width:0;}
  .side{flex:0 0 250px; display:flex; flex-direction:column; gap:1.25rem;}
  .stickies{display:flex; flex-direction:column; gap:1.25rem;}

  .grid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px;}
  .cell{
    position:relative; aspect-ratio:1/1; border:2px solid var(--line);
    background:transparent; color:var(--muted); font:inherit; font-size:.72rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0; transition:background .1s ease,border-color .1s ease,color .1s ease;
  }
  .cell{touch-action:manipulation; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;}
  .cell:hover{border-color:var(--fg); color:var(--fg);}
  .cell.done{background:var(--accent); border-color:var(--accent);
    color:var(--accent-ink); font-weight:700;}
  .cell.today{box-shadow:inset 0 0 0 2px var(--fg);}
  .cell.sel{outline:2px solid var(--fg); outline-offset:2px;}
  .cell.note::after{
    content:""; position:absolute; top:3px; right:3px; width:5px; height:5px;
    background:var(--accent);
  }
  .cell.done.note::after{background:var(--accent-ink);}
  .cell:focus-visible{outline:2px solid var(--fg); outline-offset:2px;}

  /* ---- note card ---- */
  .panel{border:2px solid var(--line); padding:.85rem; background:var(--bg);}
  .panel.pinned{border-left:5px solid var(--accent);}
  .panel.float{position:fixed; z-index:50; width:250px;
    box-shadow:6px 6px 0 var(--line); border-color:var(--fg);}
  .grip{flex:0 0 auto; color:var(--line); cursor:move; font-size:.85rem;
    letter-spacing:-1px; touch-action:none;}
  .grip:hover{color:var(--muted);}
  .panel h2{
    margin:0 0 .55rem; font-size:.72rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); font-weight:700;
    display:flex; align-items:center; gap:.5rem;
  }
  .ck{
    flex:0 0 auto; width:15px; height:15px; border:2px solid var(--line);
    background:transparent; cursor:pointer; padding:0; display:inline-flex;
    align-items:center; justify-content:center; line-height:1; color:var(--accent-ink);
    font-size:.7rem;
  }
  .ck:hover{border-color:var(--fg);}
  .ck.on{background:var(--accent); border-color:var(--accent);}
  .ck[hidden]{display:none;}
  .prog{flex:0 0 auto; color:var(--accent); letter-spacing:.06em;}
  .nav{
    flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; font-size:.95rem; line-height:1; padding:0 .15rem;
  }
  .nav:hover{color:var(--fg);}
  .card-hint{margin:-.3rem 0 .4rem; font-size:.62rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--line);}
  .card-date{color:var(--muted);}
  .ttl-input{
    flex:1 1 auto; min-width:0; background:transparent; border:none; outline:none;
    font:inherit; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); font-weight:700; padding:0;
  }
  .ttl-input::placeholder{color:var(--line);}
  .ttl-input:focus{color:var(--fg);}
  .ttl-input.done{text-decoration:line-through; color:var(--muted);}
  .ttl-input[readonly]{color:var(--muted); cursor:default;}
  .pin, .del{
    flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; line-height:1; padding:0 .15rem;
  }
  .pin{font-size:.85rem;}
  .pin:hover{color:var(--fg);}
  .pin.on{color:var(--accent);}
  .del{font-size:.9rem;}
  .del:hover{color:var(--accent);}

  /* ---- note body: iphone-style lines ---- */
  .blocks{display:flex; flex-direction:column;}
  .blk{display:flex; align-items:center; gap:.5rem; padding:.12rem 0;}
  .blk-text{
    flex:1 1 auto; min-width:0; background:transparent; border:none;
    color:var(--fg); font:inherit; font-size:.82rem; padding:.1rem 0; outline:none;
  }
  .blk-text::placeholder{color:var(--line);}
  .blk-text.done{text-decoration:line-through; color:var(--muted);}
  .bdel{
    flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; font-size:.85rem; line-height:1; padding:0 .15rem;
    opacity:0; transition:opacity .1s;
  }
  .blk:hover .bdel{opacity:.6;}
  .bdel:hover{opacity:1; color:var(--accent);}
  /* block styles from the slash menu */
  .bt-h .blk-text{font-size:1rem; font-weight:700; letter-spacing:.02em;}
  .bt-quote{border-left:3px solid var(--fg); padding-left:.6rem; margin:.2rem 0;}
  .bt-quote .blk-text{font-style:italic;}
  .bt-callout{border:2px solid var(--line); background:#161616;
    padding:.35rem .5rem; margin:.25rem 0;}
  .blk-icon{flex:0 0 auto; color:var(--accent); font-weight:700; width:15px; text-align:center;}
  .bt-divider hr{flex:1 1 auto; border:none; border-top:2px solid var(--line); margin:.55rem 0;}
  .blk-img{display:block; flex:1 1 auto; min-width:0; max-width:100%; height:auto;
    border:2px solid var(--line); margin:.25rem 0;}
  .slash{position:fixed; z-index:100; min-width:220px; padding:.25rem 0;
    background:var(--bg); border:2px solid var(--fg); box-shadow:6px 6px 0 var(--line);}
  .slash-item{display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
    padding:.3rem .65rem; font-size:.75rem; letter-spacing:.06em; cursor:pointer;}
  .slash-item small{color:var(--muted); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;}
  .slash-item.on{background:var(--accent); color:var(--accent-ink);}
  .slash-item.on small{color:var(--accent-ink);}
  .toast{position:fixed; left:50%; bottom:1rem; transform:translateX(-50%); z-index:200;
    max-width:calc(100vw - 2rem); background:var(--accent); color:var(--accent-ink);
    padding:.55rem .9rem; font-size:.72rem; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase;}
  /* the add-line buttons stay hidden until the card's small + is clicked */
  .blkbar{display:none; flex-wrap:wrap; gap:.4rem; margin-top:.5rem;}
  .blkbar.open{display:flex;}
  .more{flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    cursor:pointer; font:inherit; font-size:.95rem; line-height:1; padding:0 .15rem;}
  .more:hover{color:var(--fg);}
  .more.on{color:var(--accent);}
  .blkbar button{
    background:transparent; border:2px dashed var(--line); color:var(--muted);
    font:inherit; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.3rem .5rem; cursor:pointer;
  }
  .blkbar button:hover{border-color:var(--accent); color:var(--accent);}

  .addnote{
    background:transparent; border:2px dashed var(--line); color:var(--muted);
    font:inherit; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.6rem; cursor:pointer; width:100%;
  }
  .addnote:hover{border-color:var(--accent); color:var(--accent);}

  footer{margin-top:2.5rem; display:flex; justify-content:space-between;
    align-items:center; gap:1rem; flex-wrap:wrap;
    border-top:2px solid var(--line); padding-top:1.25rem;}
  .tools{display:flex; gap:.5rem; flex-wrap:wrap;}
  .reset, .btn{
    background:transparent; border:2px solid var(--line); color:var(--muted);
    font:inherit; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.45rem .8rem; cursor:pointer;
  }
  .reset:hover, .btn:hover{border-color:var(--accent); color:var(--accent);}
  .reset.armed{border-color:var(--accent); color:var(--accent-ink);
    background:var(--accent); font-weight:700;}
  .hint{font-size:.72rem; letter-spacing:.08em; color:var(--muted);
    text-transform:uppercase;}
  .backup.stale{color:var(--accent); font-weight:700;}
  .hint .touch{display:none;}
  @media (hover:none){ .hint .mouse{display:none;} .hint .touch{display:inline;} }


  /* free-floating page items, added from the + in the corner */
  #pageItems{position:absolute; top:0; left:0; right:0; height:0; z-index:5;}
  .pitem{position:absolute; min-width:120px;}
  .pitem:hover, .pitem.active, .pitem:focus-within{outline:2px dashed var(--line); outline-offset:4px;}
  .pi-text{display:block; width:100%; background:transparent; border:none; outline:none;
    resize:none; overflow:hidden; color:var(--fg); font:inherit; font-size:.85rem;
    line-height:1.55; padding:0;}
  .pi-text::placeholder{color:var(--line);}
  .pi-h .pi-text{font-size:1.5rem; font-weight:700; letter-spacing:.04em; line-height:1.25;}
  .pi-quote{background:#161616; border:2px solid var(--line); border-left:4px solid var(--fg);
    padding:.85rem 1rem;}
  .pi-quote .pi-text{font-style:italic;}
  .pi-callout{display:flex; gap:.6rem; align-items:flex-start; background:#161616;
    border:2px solid var(--line); padding:.75rem .9rem;}
  .pi-icon{flex:0 0 auto; color:var(--accent); font-weight:700; line-height:1.55;}
  /* page photos sit in a frame that crops; layoutPhoto() sizes and offsets the img */
  .pi-frame{position:relative; overflow:hidden; border:2px solid var(--line);}
  .pi-frame img{position:absolute; left:0; top:0; max-width:none; display:block;
    user-select:none; -webkit-user-drag:none; pointer-events:none;}
  .pi-image.cropping .pi-frame{border-color:var(--accent); cursor:grab; touch-action:none;}
  .pi-image.cropping.panning .pi-frame{cursor:grabbing;}
  .pi-image .pi-size{cursor:nwse-resize;}
  .pi-crop, .pi-fit{background:transparent; border:none; color:var(--fg); font:inherit;
    font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; padding:.25rem .35rem;
    cursor:pointer;}
  .pi-crop:hover, .pi-fit:hover{color:var(--accent);}
  .pi-crop.on{background:var(--accent); color:var(--accent-ink);}
  .pi-image:not(.cropping) .pi-fit{display:none;}
  .pi-image.cropping .pi-ctl{opacity:1;}
  .pi-image.cropping .pi-size{display:none;}
  .pi-ctl{position:absolute; top:-.2rem; right:-.2rem; display:flex; gap:.15rem;
    background:var(--bg); border:2px solid var(--fg); opacity:0; transition:opacity .1s;}
  .pitem:hover .pi-ctl, .pitem.active .pi-ctl, .pitem:focus-within .pi-ctl{opacity:1;}
  .pi-grip, .pi-del{background:transparent; border:none; color:var(--fg); font:inherit;
    font-size:.8rem; line-height:1; padding:.25rem .35rem;}
  .pi-grip{cursor:move; touch-action:none;}
  .pi-del{cursor:pointer;}
  .pi-bw{background:transparent; border:none; color:var(--fg); font:inherit; font-size:.6rem;
    letter-spacing:.08em; text-transform:uppercase; padding:.25rem .35rem; cursor:pointer;}
  .pi-bw:hover{color:var(--accent);}
  .pi-bw.on{background:var(--accent); color:var(--accent-ink);}
  .pi-del:hover{color:var(--accent);}
  .pi-size{position:absolute; right:-6px; bottom:-6px; width:12px; height:12px;
    background:var(--fg); border:2px solid var(--bg); cursor:ew-resize; touch-action:none;
    opacity:0;}
  .pitem:hover .pi-size, .pitem.active .pi-size{opacity:1;}
  .addpage{position:fixed; right:1rem; bottom:1rem; z-index:60; width:2.4rem; height:2.4rem;
    background:var(--bg); border:2px solid var(--fg); color:var(--fg); font:inherit;
    font-size:1.2rem; line-height:1; cursor:pointer;}
  .addpage:hover, .addpage.on{background:var(--accent); border-color:var(--accent);
    color:var(--accent-ink);}
  .page-menu{position:fixed; right:1rem; bottom:3.9rem;}

  /* page cover, Notion style: a full-width banner above everything */
  .cover{position:relative; height:clamp(180px, 30vh, 340px); overflow:hidden;
    border-bottom:2px solid var(--fg);}
  .cover img{display:block; width:100%; height:100%; object-fit:cover;
    user-select:none; -webkit-user-drag:none;}
  .cover.bw img{filter:grayscale(1);}
  .cover.moving{cursor:grab; touch-action:none;}
  .cover.moving.dragging{cursor:grabbing;}
  .cover-bar{position:absolute; right:1rem; bottom:1rem; display:flex; gap:.4rem;
    align-items:center; opacity:0; transition:opacity .12s;}
  .cover:hover .cover-bar, .cover.moving .cover-bar{opacity:1;}
  .cover-btn, .cover-hint{background:var(--bg); border:2px solid var(--fg); color:var(--fg);
    font:inherit; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.3rem .55rem;}
  .cover-btn{cursor:pointer;}
  .cover-btn:hover{border-color:var(--accent); color:var(--accent);}
  .cover-btn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .cover-hint{border-color:var(--line); color:var(--muted);}
  .cover:not(.moving) .cover-hint{display:none;}
  /* hidden, not removed: "done" must stay exactly where "reposition" was, or
     the buttons slide and "remove" ends up under the pointer after "done" */
  .cover.moving .cover-btn:not([data-act=move]){visibility:hidden; pointer-events:none;}
  @media (hover:none){ .cover-bar{opacity:1;} }
  .page{position:relative;}
  /* ---- sidebar of pages ---- */
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:240px; z-index:70;
    display:flex; flex-direction:column; padding:.8rem .6rem;
    background:#0b0b0b; border-right:2px solid var(--line);}
  .sb-head{display:flex; justify-content:space-between; align-items:center;
    padding:0 .4rem .7rem; font-size:.65rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);}
  .sb-close{background:transparent; border:none; color:var(--muted); font:inherit;
    font-size:.95rem; cursor:pointer; padding:0 .2rem;}
  .sb-close:hover{color:var(--fg);}
  .sb-open{position:fixed; left:.6rem; top:.6rem; z-index:69; display:none;
    width:2.1rem; height:2.1rem; background:var(--bg); border:2px solid var(--line);
    color:var(--fg); font:inherit; font-size:.95rem; cursor:pointer;}
  .sb-open:hover{border-color:var(--fg);}
  .sb-list{flex:1 1 auto; overflow:auto; display:flex; flex-direction:column; gap:2px;}
  .sb-item{display:flex; align-items:center; gap:.55rem; padding:.38rem .45rem;
    border:2px solid transparent; color:var(--fg); font-size:.78rem; cursor:pointer;}
  .sb-item:hover, .sb-item:focus-visible{background:#161616; outline:none;}
  .sb-item.on{background:#161616; border-color:var(--line);}
  .sb-ico{flex:0 0 18px; width:18px; height:18px; display:inline-flex; align-items:center;
    justify-content:center; font-size:.9rem; line-height:1; color:var(--muted); overflow:hidden;}
  .sb-ico img{width:100%; height:100%; object-fit:cover;}
  .sb-title{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sb-title.empty{color:var(--muted);}
  .sb-del{flex:0 0 auto; background:transparent; border:none; color:var(--muted);
    font:inherit; font-size:.8rem; cursor:pointer; padding:0 .2rem; opacity:0;}
  .sb-item:hover .sb-del, .sb-del.armed{opacity:1;}
  .sb-del:hover{color:var(--accent);}
  .sb-del.armed{color:var(--accent); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase;}
  .sb-new{margin-top:.6rem; background:transparent; border:2px dashed var(--line);
    color:var(--muted); font:inherit; font-size:.68rem; letter-spacing:.1em;
    text-transform:uppercase; padding:.55rem; cursor:pointer;}
  .sb-new:hover{border-color:var(--accent); color:var(--accent);}
  .main{position:relative; margin-left:240px; min-height:100vh;}
  body.sb-hidden .sidebar{display:none;}
  body.sb-hidden .main{margin-left:0;}
  body.sb-hidden .sb-open{display:block;}
  @media (hover:none){ .sb-del{opacity:.6;} }
  @media (max-width:900px){
    .main{margin-left:0;}
    .sb-open{display:block;}
    body:not(.sb-shown) .sidebar{display:none;}
    body.sb-shown .sidebar{display:flex; box-shadow:6px 0 0 var(--line);}
  }

  /* ---- page head: icon over the cover's edge, actions, title ---- */
  .top{position:relative;}
  .main.has-cover .wrap{padding-top:1.4rem;}
  .icon{position:relative; z-index:6; width:110px; height:110px; margin-bottom:.3rem;
    display:flex; align-items:center; justify-content:center;
    font-size:78px; line-height:1; cursor:pointer; user-select:none;}
  .icon img{width:100%; height:100%; object-fit:cover; border:2px solid var(--fg); display:block;}
  .main.has-cover .icon{margin-top:calc(-1.4rem - 55px);}
  .head-actions{display:flex; gap:1.1rem; align-items:center; height:1.7rem;
    opacity:0; transition:opacity .12s;}
  .top:hover .head-actions, .head-actions:focus-within{opacity:1;}
  .head-actions button{background:transparent; border:none; color:var(--muted); font:inherit;
    font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; padding:0; cursor:pointer;}
  .head-actions button:hover{color:var(--accent);}
  .head-actions button[hidden]{display:none;}
  @media (hover:none){ .head-actions{opacity:.6;} }
  .icon-pop{position:fixed; z-index:90; width:290px; padding:.6rem;
    background:var(--bg); border:2px solid var(--fg); box-shadow:6px 6px 0 var(--line);}
  .icon-pop input{width:100%; background:transparent; border:2px solid var(--line);
    color:var(--fg); font:inherit; font-size:.75rem; padding:.35rem .45rem; outline:none;}
  .icon-pop input:focus{border-color:var(--accent);}
  .icon-grid{display:grid; grid-template-columns:repeat(8, 1fr); gap:2px; margin:.5rem 0;}
  .icon-grid button{background:transparent; border:2px solid transparent; font-size:1.1rem;
    line-height:1; padding:.25rem 0; cursor:pointer;}
  .icon-grid button:hover{border-color:var(--line); background:#161616;}
  .icon-row{display:flex; gap:.4rem;}
  .icon-row button{flex:1 1 auto; background:transparent; border:2px solid var(--line);
    color:var(--muted); font:inherit; font-size:.62rem; letter-spacing:.1em;
    text-transform:uppercase; padding:.4rem; cursor:pointer;}
  .icon-row button:hover{border-color:var(--accent); color:var(--accent);}

  /* ---- document pages ---- */
  .doc-title{display:block; width:100%; margin:0 0 1.6rem; padding:0 0 1rem;
    background:transparent; border:none; border-bottom:2px solid var(--fg); outline:none;
    color:var(--fg); font:inherit; font-size:2rem; font-weight:700; letter-spacing:.04em;}
  .doc-title::placeholder{color:var(--line);}
  .doc .blk-text{font-size:.95rem;}
  .doc .bt-h .blk-text{font-size:1.35rem;}
  .doc .blk{padding:.18rem 0;}
  .doc-tail{min-height:35vh; cursor:text;}
  .pi-image.bw img{filter:grayscale(1);}

  @media (max-width:640px){
    .layout{flex-direction:column; align-items:stretch;}
    /* flatten the side column so the Day card can sit above the grid */
    .side{display:contents;}
    .side > *{order:1;}
    .side > #dayCard{order:-1;}
    h1{font-size:1.6rem;}
    .grid{gap:4px;}
    .cell{font-size:.62rem;}
    .bdel{opacity:.5;}
  }
</style>
</head>
<body>
  <div class="toast" id="toast" role="alert" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="pages">

             placeholder="name your challenge" aria-label="challenge name">

      <span class="count"><b id="done">0</b> / 100</span>
      <span class="right">
        <span>streak <b id="streak">0</b></span>
        <span>best <b id="best">0</b></span>

      <span class="hint"><span class="mouse">click a box to open it · double-click to tick · ← → to step</span><span class="touch">tap a box to open it · long-press to tick</span></span>
    </footer>

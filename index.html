<script>
(function(){
  "use strict";
  var KEY = "hundred-v1";
  var N = 100;
  function uid(){ return "n" + Math.random().toString(36).slice(2,9); }

  // block types; divider and image carry no text, an image keeps its picture in src
  var BLOCK_TYPES = ["text","todo","h","quote","callout","divider","image"];
  function normType(t){ return BLOCK_TYPES.indexOf(t) >= 0 ? t : "text"; }
  function hasText(t){ return t !== "divider" && t !== "image"; }
  function okSrc(src){ return typeof src === "string" && /^(data:image\/|https?:\/\/)/.test(src); }
  function mkBlock(type, text, done){
    return { id:uid(), type:normType(type), text:String(text||""), done:!!done };
  }
  function normBlocks(arr){
    if(!Array.isArray(arr)) return null;
    var out = arr.map(function(b){
      var o = { id:String(b && b.id || uid()), type:normType(b && b.type),
                text:String(b && b.text || ""), done:!!(b && b.done) };
      if(o.type === "image"){ if(okSrc(b.src)) o.src = b.src; else o.type = "text"; }
      return o;
    });
    return out.length ? out : [mkBlock("text","",false)];
  }
  function blockHasContent(b){
    return b.type === "image" || (hasText(b.type) && !!(b.text && b.text.trim()));
  }
  // turn an old {text, items} note into a block list
  function migrateBlocks(text, items){
    var out = [];
    if(text){
      String(text).split("\n").forEach(function(ln){ out.push(mkBlock("text", ln, false)); });
    }
    if(Array.isArray(items)){
      items.forEach(function(it){ out.push(mkBlock("todo", it && it.text, it && it.done)); });
    }
    return out.length ? out : [mkBlock("text","",false)];
  }

  // ---------- dates ----------
  var DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  function pad(n){ return (n<10?"0":"") + n; }
  function parseDate(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");
    return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
  }
  function todayDate(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function fmt(d){ return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; }

  // free-floating page items; anything malformed is dropped
  var ITEM_TYPES = ["text","h","quote","callout","image"];
  function normItems(arr){
    if(!Array.isArray(arr)) return [];
    return arr.filter(function(it){
      return it && ITEM_TYPES.indexOf(it.type) >= 0 && isFinite(it.x) && isFinite(it.y) &&
             isFinite(it.w) && (it.type !== "image" || okSrc(it.src));
    }).map(function(it){
      var o = { id:String(it.id || uid()), type:it.type, text:String(it.text || ""),
                x:+it.x, y:Math.max(0, +it.y), w:Math.min(Math.max(+it.w, 120), 1200) };
      if(it.type === "image"){
        o.src = it.src; o.bw = !!it.bw;
        // crop: h is the frame height (absent = the photo's own shape),
        // zoom 1..4 over a cover fit, px/py the pan 0..1 (0.5 = centred)
        if(isFinite(it.h) && +it.h >= 60) o.h = Math.min(+it.h, 2400);
        o.zoom = isFinite(it.zoom) ? Math.min(Math.max(+it.zoom, 1), 4) : 1;
        o.px = isFinite(it.px) ? Math.min(Math.max(+it.px, 0), 1) : 0.5;
        o.py = isFinite(it.py) ? Math.min(Math.max(+it.py, 0), 1) : 0.5;
      }
      return o;
    });
  }

  function normCover(c){
    return (c && okSrc(c.src))
      ? { src:c.src, y:isFinite(c.y) ? Math.min(Math.max(+c.y, 0), 100) : 50, bw:!!c.bw }
      : null;
  }
  // an icon is { emoji } or { src } (a small JPEG), or null
  function normIcon(i){
    if(i && typeof i.emoji === "string" && i.emoji.trim()) return { emoji:i.emoji.trim().slice(0, 16) };
    if(i && okSrc(i.src)) return { src:i.src };
    return null;
  }
  function normPages(arr){
    if(!Array.isArray(arr)) return [];
    return arr.filter(function(p){ return p && typeof p === "object"; }).map(function(p){
      return { id:String(p.id || uid()), title:String(p.title || ""),
               icon:normIcon(p.icon), cover:normCover(p.cover),
               blocks:normBlocks(p.blocks) || [mkBlock("text","",false)],
               items:normItems(p.items) };
    });
  }

  // validate any parsed object into a state, or null if it is not one
  function normalize(o){
    if(o && Array.isArray(o.days) && o.days.length === N){
      var pos = (o.pos && typeof o.pos === "object") ? o.pos : {};
      delete pos.daily;   // left over from the removed daily template card
      // notes per day -> block lists
      var dayNotes = {};
      if(o.dayNotes && typeof o.dayNotes === "object"){
        Object.keys(o.dayNotes).forEach(function(k){
          var nb = normBlocks(o.dayNotes[k]); if(nb) dayNotes[k] = nb;
        });
      }else if(o.notes && typeof o.notes === "object"){
        Object.keys(o.notes).forEach(function(k){
          var t = o.notes[k];
          if(t && String(t).trim()) dayNotes[k] = migrateBlocks(t, null);
        });
      }

      var stickies;
      if(Array.isArray(o.stickies)){
        stickies = o.stickies.map(function(s){
          var blocks = Array.isArray(s && s.blocks) ? normBlocks(s.blocks)
                                                    : migrateBlocks(s && s.text, s && s.items);
          return { id:String(s && s.id || uid()),
                   title:String(s && s.title || ""),
                   pinned:!!(s && s.pinned),
                   done:!!(s && s.done),
                   check:!!(s && (s.check || s.done)),
                   blocks:blocks };
        });
      }else{
        stickies = [ { id:uid(), title:"", pinned:false, done:false,
                       blocks:(o.scratch ? migrateBlocks(o.scratch,null) : [mkBlock("text","",false)]) } ];
      }

      return {
        days: o.days.map(Boolean),
        label: o.label || "",
        dayNotes: dayNotes,
        stickies: stickies,
        pos: pos,
        start: (typeof o.start === "string" && parseDate(o.start)) ? o.start : "",
        lastExport: (typeof o.lastExport === "string" && parseDate(o.lastExport)) ? o.lastExport : "",
        items: normItems(o.items),
        cover: normCover(o.cover),
        icon: normIcon(o.icon),
        pages: normPages(o.pages),
        sidebarHidden: !!o.sidebarHidden
      };
    }
    return null;
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      var s = raw ? normalize(JSON.parse(raw)) : null;
      if(s) return s;
    }catch(e){}
    return { days:new Array(N).fill(false), label:"", dayNotes:{}, start:"",
             lastExport:"", items:[], cover:null, icon:null, pages:[], sidebarHidden:false,
             stickies:[ { id:uid(), title:"", pinned:false, done:false,
                          blocks:[mkBlock("text","",false)] } ], pos:{} };
  }
  // a failed save (usually storage full from photos) must never be silent
  var saveFailed = false;
  function toast(msg){
    var t = document.getElementById("toast");
    if(!t) return;
    t.textContent = msg || ""; t.hidden = !msg;
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      if(saveFailed){ saveFailed = false; toast(null); }
    }catch(e){
      saveFailed = true;
      toast("storage full: changes are not being saved. delete a photo, then export a backup");
    }
  }

  var state = load();
  var grid   = document.getElementById("grid");
  var doneEl = document.getElementById("done");
  var pctEl  = document.getElementById("pct");
  var fill   = document.getElementById("fill");
  var label  = document.getElementById("label");
  var reset  = document.getElementById("reset");
  var dayCard  = document.getElementById("dayCard");
  var stickyBox = document.getElementById("stickies");
  var addBtn    = document.getElementById("addnote");
  var nodeById = {};
  var cells = [];
  var sel = 0;

  var streakEl = document.getElementById("streak");
  var bestEl   = document.getElementById("best");
  var startEl  = document.getElementById("start");
  var statusEl = document.getElementById("status");
  var backupEl = document.getElementById("backup");

  function currentIndex(){
    for(var i=0;i<N;i++){ if(!state.days[i]) return i; }
    return -1;
  }
  // index of today's box by calendar (may be <0 or >=N), or null with no start date
  function todayIndex(){
    var s = parseDate(state.start);
    return s ? Math.round((todayDate() - s) / 86400000) : null;
  }
  function dateOf(i){
    var s = parseDate(state.start);
    return s ? new Date(s.getFullYear(), s.getMonth(), s.getDate() + i) : null;
  }
  // the box marked "today": by calendar when dated, else the first unticked
  function todayCell(){
    var t = todayIndex();
    if(t === null) return currentIndex();
    return (t >= 0 && t < N) ? t : -1;
  }
  function defaultSel(){
    var t = todayIndex();
    if(t !== null) return Math.min(Math.max(t, 0), N-1);
    var c = currentIndex();
    return c === -1 ? N-1 : c;
  }
  function streaks(){
    var best = 0, run = 0, i;
    for(i=0;i<N;i++){ run = state.days[i] ? run+1 : 0; if(run > best) best = run; }
    var end, t = todayIndex();
    if(t === null){
      // undated: the run ending at the last ticked box
      end = -1;
      for(i=N-1;i>=0;i--){ if(state.days[i]){ end = i; break; } }
    }else{
      if(t < 0) return { cur:0, best:best };
      end = Math.min(t, N-1);
      // today not ticked yet does not break the streak
      if(t < N && !state.days[end]) end--;
    }
    var cur = 0;
    for(i=end;i>=0 && state.days[i];i--) cur++;
    return { cur:cur, best:best };
  }
  function renderStatus(){
    var t = todayIndex();
    if(t === null){ statusEl.textContent = "no start date"; return; }
    if(t < 0){ statusEl.textContent = "starts in " + (-t) + (t === -1 ? " day" : " days"); return; }
    var upto = Math.min(t, N), missed = 0;
    for(var i=0;i<upto;i++) if(!state.days[i]) missed++;
    var head = t < N ? "day " + (t+1) + " of " + N : "ended " + fmt(dateOf(N-1));
    statusEl.innerHTML = "";
    statusEl.appendChild(document.createTextNode(head + " · "));
    if(missed){
      var b = document.createElement("b");
      b.textContent = missed + " missed";
      statusEl.appendChild(b);
    }else{
      statusEl.appendChild(document.createTextNode(t < N ? "on track" : "perfect run"));
    }
  }
  function dayHasContent(idx){
    var a = state.dayNotes[idx];
    return !!(a && a.some(blockHasContent));
  }
  function isBlank(blocks){
    return !blocks || !blocks.some(blockHasContent);
  }
  // the blocks shown in the Day card; an empty day joins state.dayNotes
  // only once something is written in it
  function blocksFor(idx){
    var own = state.dayNotes[idx];
    return (own && own.length) ? own : [mkBlock("text","",false)];
  }
  function todoProgress(blocks){
    var total = 0, done = 0;
    blocks.forEach(function(b){
      if(b.type === "todo" && b.text && b.text.trim()){ total++; if(b.done) done++; }
    });
    return { total:total, done:done };
  }

  function renderGrid(){
    var done = 0;
    for(var i=0;i<N;i++) if(state.days[i]) done++;
    doneEl.textContent = done;
    var pct = Math.round(done/N*100);
    pctEl.textContent = pct + "%";
    fill.style.width = pct + "%";

    var st = streaks();
    streakEl.textContent = st.cur;
    bestEl.textContent = st.best;

    var cur = todayCell();
    for(var j=0;j<N;j++){
      var cls = "cell";
      if(state.days[j]) cls += " done";
      if(j===cur) cls += " today";
      if(j===sel) cls += " sel";
      if(dayHasContent(j)) cls += " note";
      cells[j].className = cls;
      var d = dateOf(j);
      cells[j].title = d ? fmt(d) : "";
    }
    renderStatus();
    if(backupEl) renderBackup();
  }

  function focusEnd(inp){ inp.focus(); var l=inp.value.length; try{ inp.setSelectionRange(l,l); }catch(e){} }
  function insertAfter(node, ref){ ref.parentNode.insertBefore(node, ref.nextSibling); }

  function clampPos(p){
    return { x: Math.min(Math.max(p.x, 0), window.innerWidth  - 60),
             y: Math.min(Math.max(p.y, 0), window.innerHeight - 40) };
  }
  function applyPositions(){
    Array.prototype.forEach.call(document.querySelectorAll(".panel[data-pid]"), function(panel){
      var p = state.pos[panel.getAttribute("data-pid")];
      if(p){ var c = clampPos(p); panel.classList.add("float");
             panel.style.left = c.x+"px"; panel.style.top = c.y+"px"; }
      else { panel.classList.remove("float");
             panel.style.left = panel.style.top = panel.style.width = ""; }
    });
  }
  function applyPos(panel){
    var p = state.pos[panel.getAttribute("data-pid")];
    if(p){ var c = clampPos(p); panel.classList.add("float");
           panel.style.left = c.x+"px"; panel.style.top = c.y+"px"; }
  }
  function makeDraggable(panel, pid, handle){
    var dragging=false, sx=0, sy=0, ox=0, oy=0;
    handle.addEventListener("pointerdown", function(e){
      dragging=true;
      var r=panel.getBoundingClientRect();
      panel.classList.add("float");
      panel.style.width=r.width+"px"; panel.style.left=r.left+"px"; panel.style.top=r.top+"px";
      sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
      handle.setPointerCapture(e.pointerId); e.preventDefault();
    });
    handle.addEventListener("pointermove", function(e){
      if(!dragging) return;
      panel.style.left=(ox+(e.clientX-sx))+"px";
      panel.style.top =(oy+(e.clientY-sy))+"px";
    });
    function end(e){
      if(!dragging) return; dragging=false;
      try{ handle.releasePointerCapture(e.pointerId); }catch(_){}
      state.pos[pid]={ x:parseFloat(panel.style.left), y:parseFloat(panel.style.top) };
      panel.style.width=""; save();
    }
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
    handle.addEventListener("dblclick", function(){
      delete state.pos[pid]; save(); applyPositions();
    });
  }

  // ---------- slash menu: "/" at the start of a line picks a block type ----------
  var SLASH = [
    { type:"text",    label:"text",      hint:"plain line",       keys:"text plain line paragraph" },
    { type:"todo",    label:"checklist", hint:"tick-box item",    keys:"checklist todo task check" },
    { type:"h",       label:"heading",   hint:"big bold line",    keys:"heading title header h1" },
    { type:"quote",   label:"quote",     hint:"line with a bar",  keys:"quote cite" },
    { type:"callout", label:"tip box",   hint:"highlighted note", keys:"tip box callout note info" },
    { type:"divider", label:"divider",   hint:"horizontal line",  keys:"divider line hr separator" },
    { type:"image",   label:"photo",     hint:"from your device", keys:"photo image picture pic" }
  ];
  var slash = { el:null, input:null, items:[], idx:0, pick:null };
  // best match first: name starts with it, then a keyword does, then the name contains it
  function slashMatches(q){
    q = q.toLowerCase().replace(/^\s+/, "");
    if(!q) return SLASH.slice();
    var scored = [];
    SLASH.forEach(function(c, i){
      var sc = c.label.indexOf(q) === 0 ? 0
             : c.keys.split(" ").some(function(k){ return k.indexOf(q) === 0; }) ? 1
             : c.label.indexOf(q) >= 0 ? 2 : -1;
      if(sc >= 0) scored.push({ c:c, sc:sc, i:i });
    });
    scored.sort(function(a, b){ return a.sc - b.sc || a.i - b.i; });
    return scored.map(function(x){ return x.c; });
  }
  function slashClose(){
    if(slash.el && slash.el.parentNode) slash.el.parentNode.removeChild(slash.el);
    slash.el = slash.input = slash.pick = null; slash.items = []; slash.idx = 0;
  }
  function slashRender(){
    var el = slash.el;
    el.innerHTML = "";
    slash.items.forEach(function(c, i){
      var it = document.createElement("div");
      it.className = "slash-item" + (i === slash.idx ? " on" : "");
      var name = document.createElement("span"); name.textContent = c.label;
      var hint = document.createElement("small"); hint.textContent = c.hint;
      it.appendChild(name); it.appendChild(hint);
      // mousedown, not click, so the line keeps focus
      it.addEventListener("mousedown", function(e){ e.preventDefault(); slashChoose(i); });
      el.appendChild(it);
    });
    var r = slash.input.getBoundingClientRect();
    el.style.left = Math.max(Math.min(r.left, window.innerWidth - el.offsetWidth - 8), 4) + "px";
    var below = r.bottom + 4;
    el.style.top = (below + el.offsetHeight > window.innerHeight
                    ? Math.max(r.top - el.offsetHeight - 4, 4) : below) + "px";
  }
  function slashUpdate(input, pick){
    var v = input.value;
    if(v.charAt(0) !== "/"){ if(slash.input === input) slashClose(); return; }
    var items = slashMatches(v.slice(1));
    if(!items.length){ if(slash.input === input) slashClose(); return; }
    if(slash.input !== input){
      slashClose();
      slash.el = document.createElement("div");
      slash.el.className = "slash"; slash.el.setAttribute("role","listbox");
      document.body.appendChild(slash.el);
      slash.input = input;
    }
    slash.pick = pick; slash.items = items;
    slash.idx = Math.max(0, Math.min(slash.idx, items.length - 1));
    slashRender();
  }
  function slashChoose(i){
    var c = slash.items[i], pick = slash.pick;
    slashClose();
    if(c && pick) pick(c.type);
  }
  // true when the key was used by the open menu
  function slashKey(input, e){
    if(slash.input !== input) return false;
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      var n = slash.items.length;
      slash.idx = (slash.idx + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
      slashRender(); e.preventDefault(); return true;
    }
    if(e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); slashChoose(slash.idx); return true; }
    if(e.key === "Escape"){ e.preventDefault(); slashClose(); return true; }
    return false;
  }
  window.addEventListener("resize", slashClose);
  window.addEventListener("scroll", function(){ if(slash.el) slashRender(); }, true);

  // ---------- photos: shrunk to a JPEG so localStorage can hold them ----------
  var photoInput = document.createElement("input");
  photoInput.type = "file"; photoInput.accept = "image/*"; photoInput.hidden = true;
  document.body.appendChild(photoInput);
  function pickPhoto(cb, maxPx){
    photoInput.value = "";
    photoInput.onchange = function(){
      var f = photoInput.files[0];
      if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var im = new Image();
        im.onload = function(){
          var max = maxPx || 720, sc = Math.min(1, max / Math.max(im.width, im.height));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(im.width * sc));
          c.height = Math.max(1, Math.round(im.height * sc));
          var g = c.getContext("2d");
          g.fillStyle = "#0f0f0f"; g.fillRect(0, 0, c.width, c.height);  // transparent PNGs
          g.drawImage(im, 0, 0, c.width, c.height);
          cb(c.toDataURL("image/jpeg", 0.72));
        };
        im.onerror = function(){
          toast("couldn't read that photo");
          setTimeout(function(){ if(!saveFailed) toast(null); }, 3000);
        };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    };
    photoInput.click();
  }

  // ---------- one body line ----------
  var PLACEHOLDER = { text:"write, or / for blocks", todo:"to-do", h:"heading",
                      quote:"quote", callout:"tip" };
  function focusText(row){
    var t = row && row.querySelector(".blk-text");
    if(t){ focusEnd(t); return true; }
    return false;
  }
  // swap a row for a freshly built one (after its block changed type)
  function rerender(opts, block, row, focus){
    var nr = addBlockRow(opts, block, row, focus);
    row.parentNode.removeChild(row);
    return nr;
  }
  // build one body line. opts: {listEl, getBlocks, save, onChange, onCheck}
  function addBlockRow(opts, block, afterRow, focus){
    var t = block.type;
    var row = document.createElement("div");
    row.className = "blk bt-" + t;   // bt-*, not blk-*: .blk-text is the input

    if(t === "divider"){
      row.appendChild(document.createElement("hr"));
    }else if(t === "image"){
      var im = document.createElement("img");
      im.className = "blk-img"; im.src = block.src; im.alt = "";
      row.appendChild(im);
    }

    var ck = null, txt = null;
    if(t === "todo"){
      ck = document.createElement("button");
      ck.type = "button"; ck.className = "ck" + (block.done ? " on" : "");
      ck.setAttribute("aria-label","check item");
      ck.textContent = block.done ? "✓" : "";
      ck.addEventListener("click", function(){
        block.done = !block.done;
        ck.classList.toggle("on", block.done);
        ck.textContent = block.done ? "✓" : "";
        txt.classList.toggle("done", block.done);
        opts.save();
        opts.onCheck && opts.onCheck(block.done);
      });
      row.appendChild(ck);
    }
    if(t === "callout"){
      var icon = document.createElement("span");
      icon.className = "blk-icon"; icon.textContent = "!"; icon.setAttribute("aria-hidden","true");
      row.appendChild(icon);
    }
    if(hasText(t)){
      txt = document.createElement("input");
      txt.type = "text"; txt.className = "blk-text" + (block.done ? " done" : "");
      txt.value = block.text; txt.spellcheck = false;
      txt.placeholder = PLACEHOLDER[t] || "";
      row.appendChild(txt);
    }

    var bdel = document.createElement("button");
    bdel.type = "button"; bdel.className = "bdel"; bdel.textContent = "×";
    bdel.setAttribute("aria-label","delete line");
    row.appendChild(bdel);

    if(afterRow) insertAfter(row, afterRow); else opts.listEl.appendChild(row);

    function changed(){ opts.save(); opts.onChange && opts.onChange(); }
    function addTextAfter(r){
      var blocks = opts.getBlocks();
      var nb = mkBlock("text", "", false);
      blocks.splice(blocks.indexOf(block) + 1, 0, nb);
      addBlockRow(opts, nb, r, true);
    }
    // turn this line into another type, picked from the slash menu
    function convertTo(type){
      block.text = ""; txt.value = "";
      if(type === "image"){
        // the line keeps its type until a photo is actually chosen
        changed();
        pickPhoto(function(src){
          if(!row.parentNode) return;              // line was removed meanwhile
          block.type = "image"; block.src = src; block.done = false;
          var nr = rerender(opts, block, row, false);
          addTextAfter(nr); changed();
        });
        return;
      }
      block.done = false; delete block.src;
      block.type = type;
      var nr = rerender(opts, block, row, hasText(type));
      if(!hasText(type)) addTextAfter(nr);
      changed();
    }

    if(txt){
      txt.addEventListener("input", function(){
        block.text = txt.value;
        slashUpdate(txt, convertTo);
        changed();
      });
      txt.addEventListener("blur", function(){ if(slash.input === txt) slashClose(); });
      txt.addEventListener("keydown", function(e){
        if(slashKey(txt, e)) return;
        var blocks = opts.getBlocks();
        if(e.key === "Enter"){
          e.preventDefault();
          // Enter on an empty checklist item leaves the list, like Notion
          if(t === "todo" && txt.value === ""){
            block.type = "text"; rerender(opts, block, row, true); changed(); return;
          }
          var nb = mkBlock(t === "todo" ? "todo" : "text", "", false);
          blocks.splice(blocks.indexOf(block) + 1, 0, nb);
          addBlockRow(opts, nb, row, true);
          changed();
        }else if(e.key === "Backspace" && txt.value === "" &&
                 txt.selectionStart === 0 && txt.selectionEnd === 0){
          e.preventDefault();
          // an empty styled line first turns back into plain text
          if(t !== "text"){
            block.type = "text"; block.done = false; rerender(opts, block, row, true); changed(); return;
          }
          if(blocks.length > 1){
            blocks.splice(blocks.indexOf(block), 1);
            var prev = row.previousElementSibling;
            while(prev && !prev.querySelector(".blk-text")) prev = prev.previousElementSibling;
            row.parentNode.removeChild(row);
            focusText(prev);
            changed();
          }
        }
      });
    }
    bdel.addEventListener("click", function(){
      var blocks = opts.getBlocks();
      if(blocks.length > 1){ blocks.splice(blocks.indexOf(block), 1); row.parentNode.removeChild(row); }
      else{
        // the last line never goes away; it just becomes an empty text line
        block.type = "text"; block.text = ""; block.done = false; delete block.src;
        rerender(opts, block, row, false);
      }
      changed();
    });

    if(focus && txt) focusEnd(txt);
    return row;
  }

  function buildBody(panel, opts){
    var list = document.createElement("div");
    list.className = "blocks";
    opts.listEl = list;

    var bar = document.createElement("div");
    bar.className = "blkbar";
    var addText = document.createElement("button");
    addText.type = "button"; addText.textContent = "+ line";
    var addCheck = document.createElement("button");
    addCheck.type = "button"; addCheck.textContent = "+ checklist";
    bar.appendChild(addText); bar.appendChild(addCheck);

    panel.appendChild(list); panel.appendChild(bar);

    // a small + in the header opens and closes the button row
    var more = document.createElement("button");
    more.type = "button"; more.className = "more"; more.textContent = "+";
    more.setAttribute("aria-label","add options");
    var head = panel.querySelector("h2"), del = head.querySelector(".del");
    if(del) head.insertBefore(more, del); else head.appendChild(more);
    function setOpen(on){ bar.classList.toggle("open", on); more.classList.toggle("on", on); }
    more.addEventListener("click", function(){ setOpen(!bar.classList.contains("open")); });
    opts.closeBar = function(){ setOpen(false); };

    function append(type){
      var blocks = opts.getBlocks();
      var nb = mkBlock(type, "", false);
      blocks.push(nb); opts.save();
      addBlockRow(opts, nb, null, true);
      opts.onChange && opts.onChange();
      opts.closeBar();
    }
    addText.addEventListener("click", function(){ append("text"); });
    addCheck.addEventListener("click", function(){ append("todo"); });

    return list;
  }

  // ---------- Day card ----------
  var dayCk, dayTitle, dayDate, dayProg, dayList, dayOpts, dayBlocks;
  function navBtn(text, label, step){
    var b = document.createElement("button");
    b.type = "button"; b.className = "nav"; b.textContent = text;
    b.setAttribute("aria-label", label);
    b.addEventListener("click", function(){ selectDay(sel + step); });
    return b;
  }
  function buildDayCard(){
    var panel = document.createElement("div");
    panel.className = "panel"; panel.setAttribute("data-pid","day");

    var h = document.createElement("h2");
    var grip = document.createElement("span");
    grip.className = "grip"; grip.setAttribute("aria-hidden","true"); grip.textContent = "⠿";
    dayCk = document.createElement("button");
    dayCk.type = "button"; dayCk.className = "ck";
    dayCk.setAttribute("aria-label","mark this day done");
    dayTitle = document.createElement("input");
    dayTitle.type = "text"; dayTitle.className = "ttl-input"; dayTitle.readOnly = true;
    dayTitle.setAttribute("aria-label","day");
    dayProg = document.createElement("span");
    dayProg.className = "prog";
    h.appendChild(grip); h.appendChild(dayCk); h.appendChild(dayTitle); h.appendChild(dayProg);
    h.appendChild(navBtn("‹", "previous day", -1));
    h.appendChild(navBtn("›", "next day", 1));
    panel.appendChild(h);
    dayDate = document.createElement("p");
    dayDate.className = "card-hint card-date";
    panel.appendChild(dayDate);

    dayOpts = {
      listEl:null,
      getBlocks:function(){ return dayBlocks; },
      save:function(){ state.dayNotes[sel] = dayBlocks; save(); },
      onChange:function(){ renderGrid(); refreshDayHead(); },
      onCheck:function(on){
        // finishing every item ticks the day; unchecking never unticks it
        var p = todoProgress(dayBlocks);
        if(on && p.total && p.done === p.total && !state.days[sel]){
          state.days[sel] = true; save();
        }
        renderGrid(); refreshDayHead();
      }
    };
    dayList = buildBody(panel, dayOpts);

    dayCk.addEventListener("click", function(){
      state.days[sel] = !state.days[sel];
      save(); renderGrid(); refreshDayHead();
    });

    dayCard.appendChild(panel);
    makeDraggable(panel, "day", grip);
    applyPos(panel);
  }
  function refreshDayHead(){
    var d = dateOf(sel);
    dayTitle.value = "DAY " + (sel+1);
    dayDate.textContent = d ? fmt(d) : "";
    dayDate.hidden = !d;
    var on = state.days[sel];
    dayCk.classList.toggle("on", on);
    dayCk.textContent = on ? "✓" : "";
    dayTitle.classList.toggle("done", on);
    var p = todoProgress(dayBlocks || []);
    dayProg.textContent = p.total ? p.done + "/" + p.total : "";
  }
  function refreshDayBody(){
    dayBlocks = blocksFor(sel);
    dayList.innerHTML = "";
    dayBlocks.forEach(function(b){ addBlockRow(dayOpts, b, null, false); });
  }
  function refreshDay(){ refreshDayBody(); refreshDayHead(); }
  function selectDay(i){
    sel = Math.min(Math.max(i, 0), N-1);
    renderGrid(); refreshDay();
  }

  // ---------- Sticky notes ----------
  function reorderStickies(){
    var pinned = state.stickies.filter(function(s){ return s.pinned; });
    var rest   = state.stickies.filter(function(s){ return !s.pinned; });
    state.stickies = pinned.concat(rest);
    state.stickies.forEach(function(s){
      var n = nodeById[s.id]; if(n) stickyBox.appendChild(n);
    });
    save();
  }

  function addStickyDom(sticky, focus){
    var panel = document.createElement("div");
    panel.className = "panel" + (sticky.pinned ? " pinned" : "");
    panel.setAttribute("data-pid", "s:" + sticky.id);
    nodeById[sticky.id] = panel;

    var h = document.createElement("h2");

    var grip = document.createElement("span");
    grip.className = "grip"; grip.setAttribute("aria-hidden","true"); grip.textContent = "⠿";

    var pin = document.createElement("button");
    pin.type = "button"; pin.className = "pin" + (sticky.pinned ? " on" : "");
    pin.setAttribute("aria-label","pin note"); pin.textContent = "⚑";

    var ck = document.createElement("button");
    ck.type = "button"; ck.className = "ck" + (sticky.done ? " on" : "");
    ck.hidden = !sticky.check;
    ck.setAttribute("aria-label","cross off note");
    ck.textContent = sticky.done ? "✓" : "";

    var title = document.createElement("input");
    title.type = "text"; title.className = "ttl-input" + (sticky.done ? " done" : "");
    title.maxLength = 40; title.spellcheck = false;
    title.value = sticky.title; title.placeholder = "untitled note";
    title.setAttribute("aria-label","note name");

    var del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.textContent = "×";
    del.setAttribute("aria-label","delete note");

    h.appendChild(grip); h.appendChild(pin); h.appendChild(ck); h.appendChild(title); h.appendChild(del);
    panel.appendChild(h);

    var opts = { listEl:null, getBlocks:function(){ return sticky.blocks; }, save:save };
    buildBody(panel, opts);

    // the cross-off box is opt-in per note
    var boxBtn = document.createElement("button");
    boxBtn.type = "button";
    function paintBox(){
      ck.hidden = !sticky.check;
      boxBtn.textContent = sticky.check ? "- checkbox" : "+ checkbox";
    }
    paintBox();
    panel.querySelector(".blkbar").appendChild(boxBtn);
    boxBtn.addEventListener("click", function(){
      sticky.check = !sticky.check;
      // removing the box also clears a cross-off, so nothing stays struck through unseen
      if(!sticky.check && sticky.done){
        sticky.done = false;
        ck.classList.remove("on"); ck.textContent = ""; title.classList.remove("done");
      }
      paintBox(); save(); opts.closeBar();
    });

    stickyBox.appendChild(panel);

    pin.addEventListener("click", function(){
      sticky.pinned = !sticky.pinned;
      pin.classList.toggle("on", sticky.pinned);
      panel.classList.toggle("pinned", sticky.pinned);
      reorderStickies();
    });
    ck.addEventListener("click", function(){
      sticky.done = !sticky.done;
      ck.classList.toggle("on", sticky.done);
      ck.textContent = sticky.done ? "✓" : "";
      title.classList.toggle("done", sticky.done);
      save();
    });
    title.addEventListener("input", function(){ sticky.title = title.value; save(); });
    del.addEventListener("click", function(){
      state.stickies = state.stickies.filter(function(s){ return s.id !== sticky.id; });
      delete nodeById[sticky.id];
      panel.parentNode && panel.parentNode.removeChild(panel);
      save();
    });

    sticky.blocks.forEach(function(b){ addBlockRow(opts, b, null, false); });
    makeDraggable(panel, "s:" + sticky.id, grip);
    applyPos(panel);
    if(focus) title.focus();
  }

  // ---------- Grid ----------
  function tickDay(idx){
    state.days[idx] = !state.days[idx];
    save(); renderGrid(); refreshDayHead();
  }
  for(var i=0;i<N;i++){
    (function(idx){
      var b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.textContent = idx+1;
      b.setAttribute("aria-label","day "+(idx+1));
      // click opens the day; double-click (or long-press on touch) ticks it
      b.addEventListener("click", function(){ if(idx !== sel) selectDay(idx); });
      b.addEventListener("dblclick", function(){ tickDay(idx); });
      var lp = null;
      function cancelLp(){ clearTimeout(lp); lp = null; }
      b.addEventListener("pointerdown", function(e){
        if(e.pointerType !== "touch") return;
        cancelLp();
        lp = setTimeout(function(){
          lp = null;
          if(idx !== sel) selectDay(idx);
          tickDay(idx);
          if(navigator.vibrate) navigator.vibrate(15);
        }, 450);
      });
      b.addEventListener("pointerup", cancelLp);
      b.addEventListener("pointercancel", cancelLp);   // fires when the touch turns into a scroll
      b.addEventListener("pointerleave", cancelLp);
      b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
      grid.appendChild(b); cells.push(b);
    })(i);
  }

  // left/right step through days, unless you are typing
  document.addEventListener("keydown", function(e){
    if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    if(homeView.hidden) return;
    if(e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var t = e.target;
    if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    e.preventDefault();
    selectDay(sel + (e.key === "ArrowLeft" ? -1 : 1));
    if(t && t.classList && t.classList.contains("cell")) cells[sel].focus();
  });

  sel = defaultSel();

  buildDayCard();
  reorderStickies();                       // put pinned first on load
  state.stickies.forEach(function(s){ addStickyDom(s, false); });

  addBtn.addEventListener("click", function(){
    var s = { id:uid(), title:"", pinned:false, done:false, check:false, blocks:[mkBlock("text","",false)] };
    state.stickies.push(s); reorderStickies();
    addStickyDom(s, true);
  });

  label.value = state.label;
  label.addEventListener("input", function(){ state.label = label.value; save(); renderSidebar(); });

  var armed = false, armTimer = null;
  reset.addEventListener("click", function(){
    if(!armed){
      armed = true; reset.classList.add("armed");
      reset.textContent = "sure? click again";
      armTimer = setTimeout(disarm, 3000); return;
    }
    clearTimeout(armTimer); disarm();
    state.days = new Array(N).fill(false);
    state.dayNotes = {};
    // a dated run restarts today
    if(state.start){ state.start = iso(todayDate()); startEl.value = state.start; }
    sel = 0; save(); renderGrid(); refreshDay();
  });
  function disarm(){ armed=false; reset.classList.remove("armed"); reset.textContent="reset all"; }

  // ---------- start date ----------
  startEl.value = state.start;
  startEl.addEventListener("change", function(){
    state.start = parseDate(startEl.value) ? startEl.value : "";
    save(); renderGrid(); refreshDayHead();
  });

  // ---------- backup ----------
  function flash(btn, text){
    var orig = btn.textContent;
    btn.textContent = text;
    setTimeout(function(){ btn.textContent = orig; }, 2000);
  }
  var exportBtn  = document.getElementById("export");
  var importBtn  = document.getElementById("import");
  var importFile = document.getElementById("importFile");
  function hasData(){
    return state.days.some(Boolean) ||
           Object.keys(state.dayNotes).some(function(k){ return !isBlank(state.dayNotes[k]); });
  }
  function renderBackup(){
    var last = parseDate(state.lastExport);
    var age = last ? Math.round((todayDate() - last) / 86400000) : null;
    backupEl.textContent = age === null ? "never backed up"
                         : age === 0 ? "backed up today"
                         : "last backup " + age + (age === 1 ? " day ago" : " days ago");
    // nag only once there is something worth losing
    backupEl.classList.toggle("stale", hasData() && (age === null || age > 7));
  }
  exportBtn.addEventListener("click", function(){
    state.lastExport = iso(todayDate()); save();
    var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "100days-" + iso(todayDate()) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    renderBackup();
  });
  importBtn.addEventListener("click", function(){ importFile.click(); });
  importFile.addEventListener("change", function(){
    var f = importFile.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      var s = null;
      try{ s = normalize(JSON.parse(r.result)); }catch(e){}
      importFile.value = "";
      if(!s){ flash(importBtn, "not a backup"); return; }
      state = s; save();
      location.reload();   // rebuild every card from the imported state
    };
    r.readAsText(f);
  });

  // ---------- pages: a Notion-style sidebar of pages ----------
  // The tracker is the home page and keeps its cover/icon/items on `state`
  // itself; every other page is { id, title, icon, cover, blocks, items } in
  // state.pages. The open page lives in the URL hash (#p/<id>), so back and
  // forward work. cur() is whichever page is open.
  var mainEl   = document.getElementById("main");
  var homeView = document.getElementById("homeView");
  var homeHead = document.getElementById("homeHead");
  var docView  = document.getElementById("docView");
  var docTitle = document.getElementById("docTitle");
  var docBody  = document.getElementById("docBody");
  var docTail  = document.getElementById("docTail");
  var sbList   = document.getElementById("sbList");
  var pageIcon = document.getElementById("pageIcon");
  var addIcon  = document.getElementById("addIcon");

  function pageById(id){ return state.pages.filter(function(p){ return p.id === id; })[0] || null; }
  function cur(){
    var m = /^#p\/(.+)$/.exec(location.hash);
    return (m && pageById(decodeURIComponent(m[1]))) || state;
  }
  function isHome(p){ return p === state; }
  function go(id){
    var want = id === "home" ? "" : "#p/" + encodeURIComponent(id);
    var have = location.hash === "#" ? "" : location.hash;
    if(want === have){ renderPage(); return; }
    if(want === "") history.pushState(null, "", location.pathname + location.search);
    else history.pushState(null, "", want);
    renderPage();
  }
  window.addEventListener("popstate", renderPage);
  window.addEventListener("hashchange", renderPage);

  // ---- icons: an emoji or a small picture ----
  function paintIcon(el, icon){
    el.innerHTML = "";
    if(!icon) return;
    if(icon.src){
      var im = document.createElement("img");
      im.src = icon.src; im.alt = ""; im.draggable = false;
      el.appendChild(im);
    }else el.textContent = icon.emoji;
  }
  function renderIcon(){
    var ic = cur().icon;
    pageIcon.hidden = !ic; addIcon.hidden = !!ic;
    paintIcon(pageIcon, ic);
    mainEl.classList.toggle("has-icon", !!ic);
  }
  var EMOJI = ["🔥","💪","📚","🧠","🎯","⚡","🚀","✍️","🏋️","🏃","🧘","💻",
               "🎧","📈","✅","⭐","🌙","☀️","🍎","💤","🗓️","🧩","🎮","❤️",
               "🖤","⚔️","🏆","📝","💰","🌱","🧪","🛠️"];
  var iconPop = null;
  function closeIconPop(){
    if(iconPop && iconPop.parentNode) iconPop.parentNode.removeChild(iconPop);
    iconPop = null;
  }
  function setIcon(ic){
    cur().icon = ic; save(); renderIcon(); renderSidebar(); closeIconPop();
  }
  function firstGrapheme(s){
    s = s.trim();
    if(!s) return "";
    if(window.Intl && Intl.Segmenter){
      var it = new Intl.Segmenter().segment(s)[Symbol.iterator]().next();
      return it.done ? "" : it.value.segment;
    }
    return Array.from(s)[0];
  }
  function openIconPop(anchor){
    closeIconPop();
    var pop = iconPop = document.createElement("div");
    pop.className = "icon-pop";
    var inp = document.createElement("input");
    inp.type = "text"; inp.placeholder = "type or paste an emoji, then enter";
    inp.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ var g = firstGrapheme(inp.value); if(g) setIcon({ emoji:g }); }
    });
    pop.appendChild(inp);
    var grid = document.createElement("div");
    grid.className = "icon-grid";
    EMOJI.forEach(function(em){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = em;
      b.addEventListener("click", function(){ setIcon({ emoji:em }); });
      grid.appendChild(b);
    });
    pop.appendChild(grid);
    var row = document.createElement("div");
    row.className = "icon-row";
    var up = document.createElement("button");
    up.type = "button"; up.textContent = "upload picture";
    up.addEventListener("click", function(){
      closeIconPop();
      pickPhoto(function(src){ setIcon({ src:src }); }, 256);
    });
    row.appendChild(up);
    if(cur().icon){
      var rm = document.createElement("button");
      rm.type = "button"; rm.textContent = "remove";
      rm.addEventListener("click", function(){ setIcon(null); });
      row.appendChild(rm);
    }
    pop.appendChild(row);
    document.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + "px";
    pop.style.top = (r.bottom + 6) + "px";
    inp.focus();
  }
  addIcon.addEventListener("click", function(e){ e.stopPropagation(); openIconPop(addIcon); });
  pageIcon.addEventListener("click", function(e){ e.stopPropagation(); openIconPop(pageIcon); });
  document.addEventListener("click", function(e){
    if(iconPop && !iconPop.contains(e.target)) closeIconPop();
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeIconPop(); });
  window.addEventListener("scroll", closeIconPop);

  // ---- sidebar ----
  function renderSidebar(){
    sbList.innerHTML = "";
    var open = cur();
    [state].concat(state.pages).forEach(function(p){
      var home = isHome(p);
      var row = document.createElement("div");
      row.className = "sb-item" + (p === open ? " on" : "");
      row.setAttribute("role","link"); row.tabIndex = 0;
      var ico = document.createElement("span");
      ico.className = "sb-ico";
      if(p.icon) paintIcon(ico, p.icon); else ico.textContent = home ? "#" : "·";
      var name = (home ? (state.label || "100 days") : p.title) || "";
      var t = document.createElement("span");
      t.className = "sb-title" + (name ? "" : " empty");
      t.textContent = name || "untitled";
      row.appendChild(ico); row.appendChild(t);
      if(!home){
        // delete takes two clicks, like reset all
        var del = document.createElement("button");
        del.type = "button"; del.className = "sb-del"; del.textContent = "×";
        del.setAttribute("aria-label","delete page");
        var armed = null;
        del.addEventListener("click", function(e){
          e.stopPropagation();
          if(!armed){
            del.textContent = "sure?"; del.classList.add("armed");
            armed = setTimeout(function(){ armed = null; del.textContent = "×"; del.classList.remove("armed"); }, 3000);
            return;
          }
          clearTimeout(armed);
          var wasOpen = cur() === p;
          state.pages = state.pages.filter(function(x){ return x !== p; });
          save();
          if(wasOpen) go("home"); else renderSidebar();
        });
        row.appendChild(del);
      }
      function open_(){ go(home ? "home" : p.id); if(isNarrow()) document.body.classList.remove("sb-shown"); }
      row.addEventListener("click", open_);
      row.addEventListener("keydown", function(e){ if(e.key === "Enter") open_(); });
      sbList.appendChild(row);
    });
  }
  document.getElementById("sbNew").addEventListener("click", function(){
    var p = { id:uid(), title:"", icon:null, cover:null, blocks:[mkBlock("text","",false)], items:[] };
    state.pages.push(p); save();
    go(p.id);
    if(isNarrow()) document.body.classList.remove("sb-shown");
    docTitle.focus();
  });
  // collapse: remembered on desktop; on narrow screens it is an overlay
  function isNarrow(){ return window.matchMedia("(max-width:900px)").matches; }
  function paintSidebarHidden(){ document.body.classList.toggle("sb-hidden", !!state.sidebarHidden); }
  document.getElementById("sbClose").addEventListener("click", function(){
    if(isNarrow()){ document.body.classList.remove("sb-shown"); return; }
    state.sidebarHidden = true; save(); paintSidebarHidden();
  });
  document.getElementById("sbOpen").addEventListener("click", function(){
    if(isNarrow()){ document.body.classList.toggle("sb-shown"); return; }
    state.sidebarHidden = false; save(); paintSidebarHidden();
  });
  paintSidebarHidden();

  // ---- document pages ----
  var docOpts = null;
  function buildDoc(p){
    docBody.innerHTML = "";
    if(!p.blocks.length) p.blocks.push(mkBlock("text","",false));
    docOpts = { listEl:docBody, getBlocks:function(){ return p.blocks; }, save:save,
                onChange:function(){} };
    p.blocks.forEach(function(b){ addBlockRow(docOpts, b, null, false); });
  }
  docTitle.addEventListener("input", function(){
    var p = cur(); if(isHome(p)) return;
    p.title = docTitle.value; save(); renderSidebar();
    document.title = p.title || "untitled";
  });
  docTitle.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); var t = docBody.querySelector(".blk-text"); if(t) focusEnd(t); }
  });
  // clicking the empty space under a page continues it, like Notion
  docTail.addEventListener("click", function(){
    var p = cur(); if(isHome(p)) return;
    var last = p.blocks[p.blocks.length - 1];
    var rows = docBody.querySelectorAll(".blk");
    if(last && last.type === "text" && !last.text && rows.length){
      focusText(rows[rows.length - 1]); return;
    }
    var nb = mkBlock("text","",false);
    p.blocks.push(nb); save();
    addBlockRow(docOpts, nb, null, true);
  });

  function renderPage(){
    var p = cur(), home = isHome(p);
    slashClose(); closeIconPop(); closePageMenu();
    homeView.hidden = !home; homeHead.hidden = !home;
    docView.hidden = home; docTitle.hidden = home;
    if(!home){ docTitle.value = p.title; buildDoc(p); }
    renderCover(); renderIcon(); renderItems(); renderSidebar();
    document.title = home ? "100 days" : (p.title || "untitled");
    window.scrollTo(0, 0);
  }

  // ---------- page cover, Notion style ----------
  // cur().cover is { src, y, bw } or null; y is the vertical crop 0..100 (%)
  var coverEl  = document.getElementById("cover");
  var coverImg = document.getElementById("coverImg");
  var addCover = document.getElementById("addCover");
  var coverBtn = function(act){ return coverEl.querySelector("[data-act=" + act + "]"); };
  var coverMoving = false;
  function renderCover(){
    var c = cur().cover;
    coverEl.hidden = !c; addCover.hidden = !!c;
    mainEl.classList.toggle("has-cover", !!c);
    if(!c){ setCoverMoving(false); return; }
    if(coverImg.getAttribute("src") !== c.src) coverImg.src = c.src;
    coverImg.style.objectPosition = "50% " + c.y + "%";
    coverEl.classList.toggle("bw", !!c.bw);
    coverBtn("bw").classList.toggle("on", !!c.bw);
  }
  function setCoverMoving(on){
    coverMoving = on;
    coverEl.classList.toggle("moving", on);
    coverBtn("move").textContent = on ? "done" : "reposition";
    if(!on) save();
  }
  function chooseCover(){
    pickPhoto(function(src){
      cur().cover = { src:src, y:50, bw:!!(cur().cover && cur().cover.bw) };
      save(); renderCover();
    }, 1800);
  }
  addCover.addEventListener("click", chooseCover);
  coverBtn("change").addEventListener("click", chooseCover);
  // remove takes two clicks (arm, then confirm within 3s), like reset all
  var rmArmed = null, rmBtn = coverBtn("remove");
  function disarmRemove(){ clearTimeout(rmArmed); rmArmed = null; rmBtn.textContent = "remove"; rmBtn.classList.remove("on"); }
  rmBtn.addEventListener("click", function(){
    if(!rmArmed){
      rmBtn.textContent = "sure?"; rmBtn.classList.add("on");
      rmArmed = setTimeout(disarmRemove, 3000); return;
    }
    disarmRemove();
    cur().cover = null; save(); renderCover();
  });
  coverBtn("bw").addEventListener("click", function(){ cur().cover.bw = !cur().cover.bw; save(); renderCover(); });
  // a double-click shouldn't flip straight back into reposition mode
  var lastMoveClick = 0;
  coverBtn("move").addEventListener("click", function(){
    var now = Date.now();
    if(now - lastMoveClick < 400) return;
    lastMoveClick = now;
    setCoverMoving(!coverMoving);
  });
  // reposition: drag the picture up or down inside the banner
  var coverDrag = null;
  coverEl.addEventListener("pointerdown", function(e){
    if(!coverMoving || e.button !== 0 || e.target.closest(".cover-bar")) return;
    coverDrag = { sy:e.clientY, y:cur().cover.y };
    coverEl.setPointerCapture(e.pointerId); coverEl.classList.add("dragging");
    e.preventDefault();
  });
  coverEl.addEventListener("pointermove", function(e){
    if(!coverDrag) return;
    var W = coverEl.clientWidth, H = coverEl.clientHeight;
    var nw = coverImg.naturalWidth, nh = coverImg.naturalHeight;
    if(!nw || !nh) return;
    var over = nh * Math.max(W / nw, H / nh) - H;        // hidden height to pan through
    if(over <= 0) return;
    // dragging down shows more of the top, so the crop moves up
    cur().cover.y = Math.min(Math.max(coverDrag.y - (e.clientY - coverDrag.sy) / over * 100, 0), 100);
    coverImg.style.objectPosition = "50% " + cur().cover.y + "%";
  });
  function endCoverDrag(e){
    if(!coverDrag) return; coverDrag = null;
    try{ coverEl.releasePointerCapture(e.pointerId); }catch(_){}
    coverEl.classList.remove("dragging"); save();
  }
  coverEl.addEventListener("pointerup", endCoverDrag);
  coverEl.addEventListener("pointercancel", endCoverDrag);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && coverMoving) setCoverMoving(false); });

  // ---------- page items: free-floating text, quotes, tip boxes, photos ----------
  // Each item is { id, type, text, src?, x, y, w }. x is px from the page's
  // centre line (so items stay put relative to the centred layout at any window
  // width), y is px from the top of the page, w is the width.
  var PAGE_TYPES = [
    { type:"text",    label:"text",    hint:"plain text box",   w:300 },
    { type:"h",       label:"heading", hint:"big bold title",   w:420 },
    { type:"quote",   label:"quote",   hint:"quote box",        w:420 },
    { type:"callout", label:"tip box", hint:"highlighted note", w:340 },
    { type:"image",   label:"photo",   hint:"from your device", w:300 }
  ];
  var PAGE_PH = { text:"write something", h:"heading", quote:"a quote that keeps you going", callout:"tip" };
  var pageBox = document.getElementById("pageItems");

  function growText(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

  function placeItem(el, it){
    el.style.left = "calc(50% + " + it.x + "px)";
    el.style.top = it.y + "px";
    el.style.width = it.w + "px";
  }

  function buildPageItem(it, focus){
    var el = document.createElement("div");
    el.className = "pitem pi-" + it.type;
    placeItem(el, it);

    var ctl = document.createElement("div");
    ctl.className = "pi-ctl";
    var grip = document.createElement("span");
    grip.className = "pi-grip"; grip.textContent = "⠿"; grip.title = "drag to move";
    var del = document.createElement("button");
    del.type = "button"; del.className = "pi-del"; del.textContent = "×";
    del.setAttribute("aria-label","remove from page");
    ctl.appendChild(grip);
    if(it.type === "image"){
      // colour stays in the saved photo; b&w is just a display toggle
      var bw = document.createElement("button");
      bw.type = "button"; bw.className = "pi-bw"; bw.textContent = "b&w";
      bw.setAttribute("aria-label","black and white");
      function paintBw(){ el.classList.toggle("bw", !!it.bw); bw.classList.toggle("on", !!it.bw); }
      paintBw();
      bw.addEventListener("click", function(){ it.bw = !it.bw; paintBw(); save(); });
      // crop: drag the picture inside its frame and scroll to zoom
      var crop = document.createElement("button");
      crop.type = "button"; crop.className = "pi-crop"; crop.textContent = "crop";
      var fit = document.createElement("button");
      fit.type = "button"; fit.className = "pi-fit"; fit.textContent = "fit";
      fit.title = "back to the photo's own shape";
      ctl.appendChild(fit); ctl.appendChild(crop); ctl.appendChild(bw);
    }
    ctl.appendChild(del);

    var ta = null;
    var frame = null, im = null;
    if(it.type === "image"){
      frame = document.createElement("div");
      frame.className = "pi-frame";
      im = document.createElement("img");
      im.src = it.src; im.alt = ""; im.draggable = false;
      frame.appendChild(im);
      el.appendChild(frame);
    }else{
      if(it.type === "callout"){
        var icon = document.createElement("span");
        icon.className = "pi-icon"; icon.textContent = "!"; icon.setAttribute("aria-hidden","true");
        el.appendChild(icon);
      }
      ta = document.createElement("textarea");
      ta.className = "pi-text"; ta.rows = 1; ta.spellcheck = false;
      ta.value = it.text; ta.placeholder = PAGE_PH[it.type] || "";
      el.appendChild(ta);
      ta.addEventListener("input", function(){ it.text = ta.value; growText(ta); save(); });
    }

    var size = document.createElement("span");
    size.className = "pi-size"; size.title = "drag to resize";
    el.appendChild(ctl); el.appendChild(size);
    pageBox.appendChild(el);
    if(ta) growText(ta);

    // size and offset the photo inside its frame from it.h / zoom / px / py
    function layoutPhoto(){
      if(!im) return;
      var nw = im.naturalWidth, nh = im.naturalHeight;
      var W = frame.clientWidth;
      if(!nw || !nh || !W) return;
      var H = it.h ? it.h - 4 : Math.round(W * nh / nw);    // it.h includes the 2px border
      frame.style.height = (H + 4) + "px";
      var sc = Math.max(W / nw, H / nh) * (it.zoom || 1);
      var dw = nw * sc, dh = nh * sc;
      im.style.width = dw + "px"; im.style.height = dh + "px";
      im.style.left = (-(dw - W) * it.px) + "px";
      im.style.top  = (-(dh - H) * it.py) + "px";
      return { ox:dw - W, oy:dh - H };
    }
    if(im){
      if(im.complete) layoutPhoto();
      im.addEventListener("load", layoutPhoto);
      var cropping = false;
      function setCropping(on){
        cropping = on;
        el.classList.toggle("cropping", on);
        crop.textContent = on ? "done" : "crop"; crop.classList.toggle("on", on);
        if(!on) save();
      }
      el.stopCrop = function(){ if(cropping) setCropping(false); };
      var lastCropClick = 0;      // a double-click on done must not re-enter crop mode
      crop.addEventListener("click", function(){
        var now = Date.now();
        if(now - lastCropClick < 400) return;
        lastCropClick = now;
        setCropping(!cropping);
      });
      fit.addEventListener("click", function(){
        delete it.h; it.zoom = 1; it.px = 0.5; it.py = 0.5;
        layoutPhoto(); save();
      });
      var pan = null;
      frame.addEventListener("pointerdown", function(e){
        if(!cropping || e.button !== 0) return;
        pan = { sx:e.clientX, sy:e.clientY, px:it.px, py:it.py };
        frame.setPointerCapture(e.pointerId); el.classList.add("panning");
        e.preventDefault();
      });
      frame.addEventListener("pointermove", function(e){
        if(!pan) return;
        var o = layoutPhoto();
        // moving the pointer right drags the picture right, so the pan goes left
        if(o.ox > 0) it.px = Math.min(Math.max(pan.px - (e.clientX - pan.sx) / o.ox, 0), 1);
        if(o.oy > 0) it.py = Math.min(Math.max(pan.py - (e.clientY - pan.sy) / o.oy, 0), 1);
        layoutPhoto();
      });
      function endPan(e){
        if(!pan) return; pan = null;
        try{ frame.releasePointerCapture(e.pointerId); }catch(_){}
        el.classList.remove("panning"); save();
      }
      frame.addEventListener("pointerup", endPan);
      frame.addEventListener("pointercancel", endPan);
      frame.addEventListener("wheel", function(e){
        if(!cropping) return;
        e.preventDefault();
        it.zoom = Math.min(Math.max((it.zoom || 1) * Math.exp(-e.deltaY * 0.0015), 1), 4);
        layoutPhoto(); save();
      }, { passive:false });
    }

    del.addEventListener("click", function(){
      cur().items = cur().items.filter(function(x){ return x.id !== it.id; });
      el.parentNode.removeChild(el); save();
    });

    // grip moves, corner handle resizes (width; height follows the content)
    function gesture(handle, onMove){
      var g = null;
      handle.addEventListener("pointerdown", function(e){
        if(e.button !== 0) return;
        g = { sx:e.clientX, sy:e.clientY, x:it.x, y:it.y, w:it.w,
              h:frame ? frame.offsetHeight : 0 };
        handle.setPointerCapture(e.pointerId); el.classList.add("active");
        e.preventDefault();
      });
      handle.addEventListener("pointermove", function(e){
        if(!g) return;
        onMove(g, e.clientX - g.sx, e.clientY - g.sy);
        placeItem(el, it); if(ta) growText(ta); layoutPhoto();
      });
      function end(e){
        if(!g) return; g = null;
        try{ handle.releasePointerCapture(e.pointerId); }catch(_){}
        el.classList.remove("active"); save();
      }
      handle.addEventListener("pointerup", end);
      handle.addEventListener("pointercancel", end);
    }
    gesture(grip, function(g, dx, dy){ it.x = g.x + dx; it.y = Math.max(0, g.y + dy); });
    gesture(size, function(g, dx, dy){
      it.w = Math.min(Math.max(g.w + dx, 120), 1200);
      // photos: the corner also sets the frame height, cropping instead of squashing
      if(frame) it.h = Math.min(Math.max(g.h + dy, 60), 2400);
    });

    if(focus && ta) ta.focus();
    return el;
  }

  function addPageItem(type){
    var spec = PAGE_TYPES.filter(function(p){ return p.type === type; })[0];
    var it = { id:uid(), type:type, text:"", w:spec.w,
               x:-Math.round(spec.w / 2),
               y:Math.round(window.scrollY + window.innerHeight / 3) };
    function commit(){ cur().items.push(it); save(); buildPageItem(it, true); }
    if(type === "image") pickPhoto(function(src){ it.src = src; commit(); });
    else commit();
  }

  // the + in the corner and its little menu
  var addPage = document.getElementById("addPage");
  var pageMenu = null;
  function closePageMenu(){
    if(pageMenu && pageMenu.parentNode) pageMenu.parentNode.removeChild(pageMenu);
    pageMenu = null; addPage.classList.remove("on");
  }
  addPage.addEventListener("click", function(e){
    e.stopPropagation();
    if(pageMenu){ closePageMenu(); return; }
    pageMenu = document.createElement("div");
    pageMenu.className = "slash page-menu";
    PAGE_TYPES.forEach(function(p){
      var row = document.createElement("div");
      row.className = "slash-item";
      var name = document.createElement("span"); name.textContent = p.label;
      var hint = document.createElement("small"); hint.textContent = p.hint;
      row.appendChild(name); row.appendChild(hint);
      row.addEventListener("click", function(){ closePageMenu(); addPageItem(p.type); });
      pageMenu.appendChild(row);
    });
    document.body.appendChild(pageMenu);
    addPage.classList.add("on");
  });
  document.addEventListener("click", function(e){
    if(pageMenu && !pageMenu.contains(e.target)) closePageMenu();
  });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    closePageMenu();
    [].forEach.call(pageBox.querySelectorAll(".pi-image"), function(el){ el.stopCrop && el.stopCrop(); });
  });

  function renderItems(){
    pageBox.innerHTML = "";
    cur().items.forEach(function(it){ buildPageItem(it, false); });
  }

  renderPage();

  window.addEventListener("resize", applyPositions);
  // the calendar day may roll over while the tab sits open
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){ renderGrid(); refreshDayHead(); }
  });

  renderGrid(); refreshDay();
})();
</script>
</body>
</html>
